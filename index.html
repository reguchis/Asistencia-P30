<script>
const DB=new Promise((r,j)=>{const q=indexedDB.open('asis',2);q.onupgradeneeded=()=>{const d=q.result;for(const s of['groups','students','classes','sessions','records','kv'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s=='kv'?'k':'id'});const o=q.transaction.objectStore('records');for(const i of['sid','stid'])if(!o.indexNames.contains(i))o.createIndex(i,i)};q.onsuccess=()=>{const d=q.result;d.onversionchange=()=>{d.close();location.reload()};r(d)};q.onerror=()=>j(q.error);q.onblocked=()=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class=card><b>La app está abierta en otra ventana.</b><p class=m>Cierra las otras ventanas de la app y vuelve a abrirla para terminar la actualización.</p></div>'}});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('el navegador canceló la operación (¿falta espacio?)'))})};
const by=(s,i,k)=>tx(s,'readonly',o=>o.index(i).getAll(k));
let BUSY=false;const once=f=>async(...a)=>{if(BUSY)return;BUSY=true;try{return await f(...a)}finally{BUSY=false}};
const all=async s=>{const r=await tx(s,'readonly',o=>o.getAll());return s=='groups'?r.sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true})):r},get=(s,k)=>tx(s,'readonly',o=>o.get(k)),rput=(s,v)=>tx(s,'readwrite',o=>o.put(v)),rdel=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
/* 2.0.7 (ver MIS DISPOSITIVOS). put anota en «u» la fecha y hora del cambio, siempre posterior a la que tenía (aunque el reloj del aparato se haya atrasado).
   En los ajustes (kv «cfg») cada ajuste que viaja entre dispositivos lleva su propia fecha en «us», y solo cambia si cambió ese ajuste.
   del deja además la marca de lo borrado; si era una clase tomada que seguía abierta, la marca lo indica («a»). rput y rdel escriben tal cual. */
const put=async(s,v)=>{if(s=='kv'){if(v&&v.k=='cfg'){const e=await get('kv','cfg'),a=mdCfg(e&&e.v),b=mdCfg(v.v),us={...(e&&e.us||{})},n=Date.now();for(const k of MDK)if(b[k]!==a[k])us[k]=Math.max(n,(+us[k]||0)+1);v.us=us}return rput(s,v)}
const e=v&&v.id!=null?await get(s,v.id):null;v.u=Math.max(Date.now(),(+(e&&e.u)||0)+1,(+v.u||0)+1);return rput(s,v)};
const del=async(s,k)=>{if(s=='kv'||s=='records')return rdel(s,k);const d=await DB;return new Promise((res,rej)=>{const t=d.transaction([s,'kv'],'readwrite'),o=t.objectStore(s),q=o.get(k);q.onsuccess=()=>{const e=q.result,r={k:'md|x|'+s+'|'+k,v:Math.max(Date.now(),(+(e&&e.u)||0)+1)};if(s=='sessions'&&e&&!e.closed)r.a=1;o.delete(k);t.objectStore('kv').put(r)};t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})};
/* 2.0.19: borra muchos datos en UNA sola operación (o se borra todo o nada), con las mismas marcas de borrado que del() */
const delMany=async L=>{if(!L.length)return;const d=await DB,sts=[...new Set([...L.map(x=>x[0]),'kv'])],n=Date.now();return new Promise((res,rej)=>{const t=d.transaction(sts,'readwrite'),kv=t.objectStore('kv');for(const[s,k]of L){const o=t.objectStore(s);if(s=='records'||s=='kv'){o.delete(k);continue}const q=o.get(k);q.onsuccess=()=>{const e=q.result,r={k:'md|x|'+s+'|'+k,v:Math.max(n,(+(e&&e.u)||0)+1)};if(s=='sessions'&&e&&!e.closed)r.a=1;o.delete(k);kv.put(r)}}t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('el navegador canceló la operación'))})};
/* 2.0.19: las claves de los registros de varias clases o alumnos, leídas en una sola operación */
const keysBy=async(i,ks)=>{if(!ks.length)return[];const d=await DB;return new Promise((res,rej)=>{const t=d.transaction('records','readonly'),x=t.objectStore('records').index(i),out=[];for(const k of ks)x.getAllKeys(k).onsuccess=e=>out.push(...e.target.result);t.oncomplete=()=>res(out);t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error||new Error('el navegador canceló la operación'))})};
const clr=s=>tx(s,'readwrite',o=>o.clear());
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:var(--t);color:var(--bg);padding:12px;border-radius:10px;text-align:center;cursor:pointer';e.title='Toca para cerrar';e.onclick=()=>{e.hidden=true};document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,Math.min(9000,Math.max(3500,t.length*75)))}
function ask(t,f){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML=`<div class=card style="max-width:340px"><p>${esc(t)}</p><div class=row><button class=g id=no>Cancelar</button><button id=si style="background:var(--er)">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#si').onclick=async()=>{d.remove();await f()}}
const $=s=>document.querySelector(s),app=$('#app'),pad=n=>String(n).padStart(2,'0');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()),FHM=()=>{const n=new Date();return ymd(n)+'_'+pad(n.getHours())+pad(n.getMinutes())};
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},v=id=>document.getElementById(id).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={P:['✓ Asistencia','cP'],R:['⚠ Retardo','cR'],F:['✕ Falta','cF'],J:['ⓘ Permiso','cJ']};
const LEG='<p class=leg><span class="ch cP">Asistencia</span> <span class="ch cR">Retardo</span> <span class="ch cF">Falta</span> <span class="ch cJ">Permiso</span> <span class="ch cN">Pendiente</span></p>';
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const VER='2.0.22';
let cfg={tol:10,ant:10,pend:'F',doc:'',snd:true},tab='hoy',S=null,stream=null,scanning=false,last='',lastT=0,imp=[],FD='',ND='',NS=null,NO='';
const opts=(a,f)=>a.map(f).join('');
/* 2.0.9: singular/plural en un solo lugar */const PL=(n,a,b)=>n+' '+(n==1?a:b),SP=x=>String(x==null?'':x).trim().replace(/\s+/g,' ');
let SHW={alu:false,hor:false,grp:true};try{SHW={...SHW,...JSON.parse(localStorage.getItem('shw')||'{}')}}catch(e){}
function tgl(k){SHW[k]=!SHW[k];try{localStorage.setItem('shw',JSON.stringify(SHW))}catch(e){}const d=$('#ls-'+k),b=$('#bt-'+k);if(d)d.hidden=!SHW[k];if(b)b.textContent=SHW[k]?'Ocultar lista':'Mostrar lista'}
const tbtn=(k,n)=>n?`<button class=g id=bt-${k} style="padding:6px 12px;white-space:nowrap" onclick="tgl('${k}')">${SHW[k]?'Ocultar lista':'Mostrar lista'}</button>`:'';
function go(t){tab=t;S=null;FD='';ND='';NS=null;NO='';stopCam();const w=$('#toast');if(w)w.hidden=true;show()}
function salir(){ask('¿Salir de la app? Tus datos quedan guardados en este celular.',bye)}
function bye(){stopCam();S=null;tab='bye';const n=$('nav');if(n)n.style.display='none';const ub=$('#updb');if(ub)ub.hidden=true;app.innerHTML=`<div class=card style="text-align:center;margin-top:18vh"><h2>Saliste de la app</h2><p class=m>Tus datos quedaron guardados y la cámara está apagada. Ya puedes cerrar esta ventana o volver a la pantalla de inicio de tu celular.</p><button class=big onclick="back()">Volver a entrar</button><p class=wa id=byeh hidden style="margin:16px 0 0;font-size:15px">Este teléfono no permite que la app se cierre sola. Sal como de cualquier app: desliza hacia arriba desde el borde inferior de la pantalla o usa el botón de inicio.</p></div>`;setTimeout(()=>{try{window.close()}catch(e){}},300);/* 2.0.21: si sigue abierta (iPhone o Chrome sin instalar), se explica cómo salir */setTimeout(()=>{const x=$('#byeh');if(x&&tab=='bye'&&document.visibilityState=='visible')x.hidden=false},1500)}
function back(){const n=$('nav');if(n)n.style.display='';go('hoy')}
/* 2.0.19: si se pide otra pantalla mientras se arma esta, se dibuja solo la última */let SHN=0;
async function show(){const k=++SHN;document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t-'+tab));const fn={hoy,alu,hor,rep,aju}[tab];if(!fn)return;const x=await fn();if(k==SHN)app.innerHTML=x}
async function saveFile(n,data,pre){const lb=(pre?pre+'. ':'')+(n.startsWith('reporte')?'Reporte exportado: ':'Archivo generado: ')+n;try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:n,data});toast(lb);return true}}}catch(e){if(e&&e.code=='declined'){toast('Descarga cancelada');return false}}
try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=n;document.body.appendChild(a);a.click();a.remove();toast(lb+' (revisa tus descargas)');return true}catch(x){toast('No se pudo descargar: usa la vista previa o copia el texto');return false}}
/* 2.0.19: el cuadro «para copiar» solo muestra archivos pequeños: dibujar varios MB de texto congelaba el celular */
const expSet=(t,n)=>{const e=$('#exp');if(!e)return;e.value=t.length<=200000?t:'El archivo '+(n||'')+' pesa '+(t.length>=1048576?(t.length/1048576).toFixed(1)+' MB':Math.round(t.length/1024)+' KB')+': es demasiado grande para mostrarlo aquí. Ya se generó como archivo.'};
function dl(n,t){expSet(t,n);saveFile(n,n.endsWith('.csv')?'﻿'+t:t)}
/* HOY */
async function hoy(){const[cl,gs,ss,st]=await Promise.all([all('classes'),all('groups'),all('sessions'),all('students')]);
const now=new Date(),t=hm(now),today=ymd(now),g=id=>(gs.find(x=>x.id==id)||{}).name||'?';
const mine=cl.filter(c=>c.day==now.getDay()).sort((a,b)=>a.start.localeCompare(b.start));
const done=c=>ss.find(s=>s.date==today&&(s.cid==c.id||s.gid==c.gid&&s.subject==c.subject&&s.start==c.start));
const ant=cfg.ant>=0?+cfg.ant:10,cur=mine.find(c=>mins(t)<mins(c.end)&&mins(c.start)-mins(t)<=ant),nxt=mine.find(c=>c!=cur&&c.start>t);

function man(n){if(tab!='man')MANB={t:tab,s:S&&!S.closed&&$('#cnt')?S:null};stopCam();tab='man';document.querySelectorAll('nav button').forEach(b=>b.classList.remove('on'));app.innerHTML=`<div class=np><button onclick="prt('manual-asistencia_v'+VER+'_'+ymd(new Date()))">Imprimir / PDF</button> <button class=g onclick="manBack()">Volver</button></div><div class="card man"><h2>Manual de uso</h2>
<p class=m>Versión ${VER}. Guía para usar la app paso a paso.</p>
<h3>1. Qué hace la app</h3><ul><li>En la parte superior de todas las pestañas aparece el título «Control de Asistencia» y, debajo, «30 Santo Domingo».</li><li>Registra la asistencia de tus grupos escaneando el código QR de la credencial de cada alumno, escribiendo su matrícula o marcándolo en la lista.</li><li>Todos los datos se guardan <b>solo en este celular y en este navegador</b>. No hay servidor ni cuenta: nadie más los ve, pero tampoco se respaldan solos. Para tener los mismos datos en tu celular, tu tablet y tu computadora, ver sección 12.</li><li>Una vez instalada, funciona sin internet.</li><li><b>Menú inferior</b>: cinco pestañas siempre visibles: Hoy, Alumnos, Horario, Reportes y Ajustes. La pestaña en la que estás se ve en azul. Cada una se explica en su sección de este manual.</li><li><b>Ventanas de confirmación</b>: las acciones que borran datos o cierran la app preguntan antes. Cancelar no hace nada; Confirmar ejecuta la acción.</li><li><b>Tarjetas plegadas</b>: las tarjetas que se usan poco aparecen cerradas, con una flecha ▸ a la derecha del título: «Importar CSV» y «Compartir alumnos con QR» en Alumnos, «Importar horario CSV» en Horario, y «Mis dispositivos», «Borrar datos» y «Acerca de la app» en Ajustes (además de las de Hoy). Toca el título para abrirla (▾) y otra vez para cerrarla. Mientras la app esté abierta recuerdan cómo las dejaste; al volver a abrir la app aparecen cerradas. «Mis dispositivos» se abre sola si tienes pendiente «Deshacer la última recepción».</li><li><b>Ayuda «?»</b>: el botón redondo arriba a la derecha abre este manual en el tema de la pantalla donde estás (Hoy, pasar lista, Alumnos, Horario, Reportes o Ajustes). Volver te regresa ahí; si estabas pasando lista, a esa misma lista.</li><li><b>Cómo usar este manual</b>: arriba está el buscador (escribe una palabra, por ejemplo «respaldo»; no importan acentos ni mayúsculas, y al tocar un resultado te lleva a él), los accesos «¿Qué quieres hacer?» y el índice con los 14 temas. Cada tema se abre y se cierra tocando su título; «Abrir todo» y «Cerrar todo» los abren o cierran juntos, y «↑ Índice» te regresa arriba. Imprimir / PDF saca el manual completo.</li><li><b>Avisos</b>: los mensajes breves que aparecen abajo (por ejemplo «Guardado») desaparecen solos en unos segundos; tócalos para cerrarlos antes.</li></ul>
<h3>2. Primeros pasos (una sola vez)</h3><ol><li><b>Nombre del docente</b>: escríbelo en la tarjeta que aparece en Hoy y pulsa Guardar. Saldrá en todos los reportes.</li><li><b>Alumnos</b>: importa tu lista en CSV (crea los grupos automáticamente) o crea los grupos y agrega alumnos a mano.</li><li><b>Credenciales</b>: en Alumnos, pulsa Credenciales en cada grupo, imprime o guarda en PDF y entrega una a cada alumno.</li><li><b>Horario</b>: importa tu horario en CSV o captura cada clase a mano.</li><li><b>Ajustes</b>: revisa la tolerancia de retardo y la anticipación para tomar asistencia, ambas en minutos.</li><li><b>Respaldo</b>: al terminar, en Ajustes pulsa Exportar respaldo y guarda el archivo.</li></ol>
<h3>3. Colores de los estados</h3>${LEG}<ul><li>Verde = asistencia, amarillo = retardo, rojo = falta, naranja = permiso, blanco = pendiente (alumno sin registro).</li><li>Son los mismos en la lista, la confirmación del escaneo, el historial y los reportes (pantalla, PDF, PNG y JPG).</li></ul>
<h3>4. Pestaña Hoy</h3><ul><li><b>Docente</b>: muestra tu nombre; el botón Cambiar te lleva a Ajustes para modificarlo.</li><li><b>Salir</b>: cierra la app (ver sección 9).</li><li><b>Clase actual</b>: se detecta sola según tu horario, el día y la hora. Aparece desde los minutos de anticipación que elijas en Ajustes (10 de fábrica) antes de que empiece y hasta que termina. Si registras antes de la hora de inicio cuenta como asistencia. Botón TOMAR ASISTENCIA (o CONTINUAR ASISTENCIA si la dejaste abierta). Cuando ya la cerraste, dice ✓ ASISTENCIA REGISTRADA. Si la marcaste como no impartida, dice ⊘ CLASE NO IMPARTIDA con su motivo y el botón queda deshabilitado.</li><li><b>Próxima clase</b>: la siguiente clase del día. Es solo informativa; se convierte en clase actual al llegar su anticipación. Si ya está marcada como no impartida, lo indica con ⊘ y su motivo.</li><li><b>Mis clases de hoy</b>: tabla con el horario, la materia y el grupo de cada clase. El símbolo de la izquierda indica su estado: ✓ Registrada (ya cerrada), ● En curso (abierta, sin cerrar), ○ Pendiente o ⊘ No impartida. La clase actual aparece en negritas. La pantalla se actualiza sola cada medio minuto.</li><li><b>Botones Tomar y Continuar</b> (en Mis clases de hoy): cada clase que no está cerrada tiene su botón debajo de su horario. <b>Tomar</b> abre la asistencia de esa clase aunque todavía no sea su hora o ya haya pasado; <b>Continuar</b> vuelve a abrir una que dejaste sin finalizar. Las clases ya registradas muestran <b>Corregir</b> (ver «Corregir una clase cerrada» en la sección 5). Si la hora de la clase ya pasó, el escaneo y la matrícula registran Retardo porque la tolerancia ya terminó: en ese caso marca a cada alumno con los botones A, R, F y P de Ver lista. Si abriste una clase por error, elimínala con ✕ en «Clases sin cerrar».</li><li><b>Botón No impartida</b> (en Mis clases de hoy): aparece junto a Tomar en las clases pendientes. Úsalo cuando la clase no se dio, por ejemplo porque el grupo salió a una actividad. Pide el motivo (obligatorio): elige «Actividad fuera de la escuela» o «Suspensión de labores», o «Otro motivo…» para escribirlo. La clase queda marcada con ⊘ y su motivo, y <b>nadie recibe falta ni asistencia</b>. El botón no aparece en clases que ya tienen lista. <b>Quitar</b> borra la marca y la clase vuelve a quedar pendiente.</li><li><b>Día sin clases</b> (tarjeta en Hoy): para una suspensión de labores. Elige la fecha (hoy, un día pasado o uno futuro) y el motivo, y pulsa «Revisar clases de ese día»: verás las clases de tu horario de ese día de la semana y cuáles se marcarán. Las que ya tienen asistencia no se modifican. Al confirmar, todas quedan como no impartidas. Si la fecha es futura, cuando llegue ese día tus clases ya aparecerán con ⊘. Debajo se listan los días marcados del último mes y los futuros; <b>Quitar</b> deshace todo ese día. Si cambias tu horario después de marcar un día futuro, las clases nuevas de ese día no quedan marcadas: márcalas con el botón No impartida.</li><li><b>Tarjetas plegadas</b>: «Día sin clases», «Corregir una clase cerrada» y «Clase extraordinaria / sustitución» se muestran solo con su título, porque se usan de vez en cuando. Toca el título para abrirla y otra vez para cerrarla. Mientras la app esté abierta, cada una se queda como la dejaste.</li><li><b>Respaldo pendiente</b>: si tienes datos y pasaron 7 días sin exportar un respaldo en este dispositivo (o nunca lo has hecho), aparece este aviso debajo de «Mis clases de hoy», con el botón «Exportar respaldo ahora». Desaparece al respaldar. Enviar los datos a tu otro dispositivo no cuenta como respaldo.</li><li><b>Clases sin cerrar</b>: si saliste de una clase sin finalizarla, aparece aquí, incluso días después. Continuar la abre para terminar de pasar lista y finalizarla; ✕ la elimina con sus registros. Mientras no la finalices, no cuenta en los reportes; solo «Asistencia del día» la muestra, con «(sin cerrar)» en su columna.</li><li><b>Corregir en Horario</b>: este aviso solo aparece si alguna clase de tu horario quedó guardada sin día; el botón te lleva a la pestaña Horario para elegirle el día.</li><li><b>Corregir una clase cerrada</b> (tarjeta en Hoy): aparece cuando ya tienes clases cerradas. Sirve para las clases de otro día y para las extraordinarias: elige la fecha y pulsa Corregir en la clase. Las de hoy se corrigen más rápido con el botón Corregir de «Mis clases de hoy». Cada clase de la lista tiene también <b>✕ para eliminarla</b> (pide confirmación): se borran esa clase y sus registros, y deja de aparecer en los reportes<span class=xls> y en el archivo para Excel</span>; el grupo, sus alumnos, el horario y las demás clases no cambian. Sirve, por ejemplo, para borrar una clase de prueba. Las clases marcadas como no impartidas también aparecen ahí, solo con ✕. Si usas «Mis dispositivos», el borrado llega también a tus otros dispositivos.</li><li><b>Clase extraordinaria / sustitución</b>: para una clase fuera de horario. Elige el grupo, escribe la materia y pulsa Iniciar ahora; dura 50 minutos y la tolerancia cuenta desde ese momento.</li></ul>
<h3>5. Tomar asistencia</h3><ul><li><b>Cámara</b>: al abrir la clase la cámara está <b>apagada</b>. Si quieres escanear, pulsa ACTIVAR CÁMARA y acepta el permiso; APAGAR CÁMARA la detiene. Puedes pasar lista sin cámara, con la matrícula o la lista.</li><li><b>Escanear</b>: con la cámara activa, acerca el QR de la credencial. Registra y sigue escaneando sin detenerse; mientras escaneas la app pide que la pantalla no se apague, también al volver a ella desde otra app (en iPhone necesita iOS 16.4 o posterior). Si el sonido está activado en Ajustes, un pitido agudo confirma cada registro y uno grave avisa de un error.</li><li><b>Escanear con foto</b> (botón 📸 ESCANEAR CON FOTO): abre la cámara normal del celular o tablet; toma la foto de la credencial, a 20–30 cm y con buena luz, y la app lee su QR y registra al alumno igual que al escanear (misma tolerancia, mismos avisos y pitido). Si en la foto salen varias credenciales completas, puede registrarlas todas. Es más lento que la cámara en vivo, pero sirve en aparatos donde la cámara en vivo no se ve o hace parpadear la pantalla.</li><li><b>Tolerancia</b>: arriba de la cámara se indica hasta qué hora cuenta como asistencia. Dentro de la tolerancia registra <b>Asistencia</b>; después registra <b>Retardo</b>.</li><li><b>Avisos del escaneo</b>: «Asistencia ya registrada» (muestra la hora del primer registro y no duplica), «El alumno no pertenece a este grupo» y «QR no encontrado» (la credencial no es de esta app o se generó en otro celular; ver sección 11).</li><li><b>Contador</b> 28 / 35: alumnos con registro del total del grupo.</li><li><b>En línea / Sin conexión</b>: el indicador de arriba solo informa si el celular tiene internet. La asistencia se guarda igual en los dos casos.</li><li><b>Introducir matrícula</b>: escribe la matrícula y pulsa Enter o el botón. Aplica la misma regla de tolerancia.</li><li><b>Ver lista</b>: muestra a todos con su estado. Los botones A (asistencia), R (retardo), F (falta) y P (permiso) registran o corrigen a mano; el estado actual queda resaltado. Quien no tiene registro aparece como Pendiente.</li><li><b>Finalizar</b>: muestra el resumen y pregunta qué hacer con los pendientes: MARCAR COMO FALTA o DEJAR PENDIENTES. Si no quedó ningún pendiente, aparece solo el botón CERRAR CLASE. Después de cerrar ya no se escanea ni se captura matrícula en esa clase, pero el estado de cualquier alumno se puede cambiar con Corregir.</li><li><b>Corregir una clase cerrada</b>: por si un alumno llegó después del pase de lista o hay que cambiar una falta por permiso. En Hoy pulsa Corregir en la clase; se abre la lista con el resumen de la clase. Toca A, R, F o P en el alumno: el cambio se guarda al momento, un aviso indica el cambio (por ejemplo «Falta → Retardo») y la clase sigue cerrada, así que no hay que finalizarla otra vez. LISTO regresa a Hoy. La hora del registro original se conserva. Los reportes muestran el cambio la siguiente vez que pulses Generar.</li><li><b>Volver a Hoy</b>: regresa a Hoy sin cerrar; puedes continuar después con CONTINUAR ASISTENCIA.</li><li>Si la cámara no está disponible, usa la matrícula o la lista.</li></ul>
<h3>6. Pestaña Alumnos</h3><ul><li><b>Grupos</b>: escribe el nombre (ej. 3A) y pulsa Agregar grupo. La tabla muestra cada grupo con su número de alumnos, el botón Credenciales y ✕ para eliminarlo (borra también sus alumnos, sus clases del horario y sus asistencias; pide confirmación). El botón Mostrar lista / Ocultar lista despliega o esconde la tabla.</li><li><b>Credenciales</b>: muestra la credencial de cada alumno con su nombre, matrícula, grupo y QR. Imprimir / PDF las manda a la impresora o las guarda como PDF (con nombre como credenciales_1A_2026-10-13); Volver regresa a Alumnos. El QR no contiene datos personales, solo un código.</li><li><b>Nuevo alumno</b>: matrícula (única), nombre completo y grupo; pulsa Guardar alumno.</li><li><b>Importar CSV</b>: columnas Matrícula, Nombre, Grupo. Un solo archivo puede traer a todos los grupos: cada alumno va al grupo de su fila y los grupos que no existan se crean solos («3A» y «3°A» cuentan como el mismo). Al elegir el archivo aparece la vista previa con cuántos alumnos van a cada grupo, cuántos son nuevos y cuántos ya existen, y los errores por línea (matrícula repetida en el archivo, campos faltantes). <b>Si la matrícula ya existe, el alumno se actualiza</b>: cambian su nombre y su grupo según el archivo, y conserva sus asistencias y su credencial con QR. Los alumnos de la app que no vienen en el archivo no se borran; para darlos de baja usa ✕. Nada se guarda hasta pulsar Confirmar importación. También puedes pegar el texto en el cuadro y pulsar Vista previa.</li><li><b>Formato del CSV</b>: en Excel usa Guardar como → CSV. Acepta coma, punto y coma o tabulador, con o sin encabezados; con encabezados las columnas pueden ir en cualquier orden. La app no lee archivos .xlsx.</li><li><b>Compartir alumnos con QR</b>: ver sección 11.</li><li><b>Lista de alumnos</b>: al final de la pestaña. El botón Mostrar lista / Ocultar lista la despliega o la esconde; el encabezado indica siempre cuántos alumnos hay. Está ordenada por grupo y nombre. Cada renglón muestra el nombre con su matrícula debajo, el grupo, el lápiz (editar) y ✕, que elimina al alumno y sus asistencias.</li><li><b>Borrar todos los alumnos</b>: botón debajo de la lista. Quita a todos los alumnos de todos los grupos, junto con sus asistencias y las clases ya tomadas; conserva los grupos y el horario. Pide confirmación y es permanente: exporta un respaldo antes. Las credenciales QR dejan de funcionar, porque al volver a cargar a los alumnos reciben un QR nuevo; para conservar los mismos QR, antes usa «Exportar alumnos con QR» y después carga ese archivo en la misma tarjeta. Si solo quieres corregir nombres o grupos no hace falta borrar: importa el CSV. Solo borra en este dispositivo (ver sección 12).</li><li><b>Editar alumno</b> (botón del lápiz ${PEN}): en la lista de alumnos, el lápiz abre una ventana con la matrícula, el nombre y el grupo. Corrige lo necesario y pulsa Guardar; Cancelar cierra sin cambios. La matrícula no puede repetirse. Sus asistencias se conservan y su QR no cambia, así que la credencial impresa sigue funcionando (solo mostrará los datos anteriores hasta que la imprimas de nuevo). El nombre y la matrícula corregidos aparecen también en los reportes de clases anteriores.</li><li><b>Cambiar a un alumno de grupo</b>: se hace con el botón del lápiz. La ventana avisa que sus asistencias anteriores se conservan, pero que dejará de aparecer en los reportes del grupo anterior y que en el grupo nuevo aparecerá como pendiente en las clases anteriores al cambio.</li></ul>
<h3>7. Pestaña Horario</h3><ul><li><b>Agregar clase</b>: grupo, materia, día (de lunes a domingo), inicio y término; pulsa Agregar. Las horas pueden escribirse como 07:00, 7:00 o 1:30 pm. Si algo está mal, el aviso dice cuál campo y qué hora leyó. En el archivo CSV, una hora de 1:00 a 5:59 sin a.m. ni p.m. se lee como de la tarde (1:00 → 13:00) y la vista previa lo avisa.</li><li><b>Importar horario CSV</b>: columnas Grupo, Materia, Día, Inicio, Término, una fila por clase. El día puede ser Lunes, Lun, L o un número (1 = lunes … 6 = sábado, 7 = domingo); para miércoles usa Mié, Miércoles o X. Los grupos que no existan se crean solos. La vista previa muestra las clases por día, dice cuáles son nuevas, cuáles ya existen y se actualizan y cuáles quedan sin cambios, avisa si dos clases se empalman y marca los errores por línea. <b>Una clase se reconoce por su grupo, día y hora de inicio</b>: si ya existe, se actualizan su materia y su hora de término. Si el horario de la app tiene clases de esos grupos que no vienen en el archivo, aparece la casilla «Quitar del horario…» (marcada de fábrica) para que el horario quede igual al archivo; desmárcala si el archivo no trae el horario completo. Las asistencias ya tomadas se conservan siempre. Nada se guarda hasta Confirmar importación, y volver a importar el mismo archivo no duplica clases. También puedes pegar el texto en el cuadro y pulsar Vista previa.</li><li><b>Lista de clases</b>: al final de la pestaña. El botón Mostrar lista / Ocultar lista la despliega o la esconde; el encabezado indica cuántas clases hay. Es una tabla con día, horario, materia y grupo, ordenada de lunes a domingo y por hora; ✕ quita una clase del horario (pide confirmación; las asistencias ya tomadas se conservan).</li><li><b>Editar clase</b> (botón del lápiz ${PEN}): en la lista de clases, el lápiz abre una ventana con el grupo, la materia, el día, el inicio y el término. Corrige lo necesario y pulsa Guardar; Cancelar cierra sin cambios. Se revisa lo mismo que al agregar: día elegido, horas válidas y término posterior al inicio. Las asistencias ya tomadas no se alteran: cada clase tomada conserva su fecha, horario y grupo.</li><li><b>Cambiar el nombre de una materia</b>: si al editar una clase cambias la materia y ese grupo tiene más clases en el horario o clases ya tomadas con el nombre anterior, la app pregunta qué hacer. «Sí, cambiar en todas» pone el nombre nuevo también en ellas (útil para corregir un error de escritura, y así en Reportes no salen como dos materias). «No, solo esta clase» cambia únicamente la clase que editas. Cancelar regresa a la ventana de edición.</li><li><b>Borrar todo el horario</b>: quita todas las clases para cargar un horario nuevo (por ejemplo, cada semestre). Las asistencias ya registradas se conservan. Solo borra en este dispositivo (ver sección 12).</li></ul>
<h3>8. Pestaña Reportes</h3><ul><li>El formulario va en orden: primero el <b>Tipo de reporte</b>, después el <b>Grupo</b> y, si quieres, la <b>Materia</b>, luego las fechas que usa ese reporte, y al final pulsa <b>Generar</b> (el botón ancho). Debajo, en una sola fila, «Descargar el reporte generado»: <b>PDF</b>, <b>PNG</b>, <b>JPG</b> y <b>CSV</b>.<span class=xls> Más abajo y aparte está «Exportar para Excel».</span></li><li><b>Recuerda lo que elegiste</b>: mientras la app esté abierta, al volver a Reportes encuentras el mismo tipo, grupo, materia y fechas. Al cerrar y abrir la app vuelven los de fábrica: «Asistencia del día (por materia)» con el día de hoy (si cambias a otro tipo, el periodo va del primer día del mes a hoy).</li><li><b>Tipos de reporte</b>, en este orden: Asistencia del día (por materia), el que más se usa y el que aparece elegido; Resumen general (todos); Solo faltas; Solo retardos; Solo permisos; Solo asistencias; Solo pendientes (sin registro); y Clases no impartidas.<span class=xls> Para «Exportar para Excel» elige cualquier tipo con periodo (por ejemplo, Resumen general).</span></li><li><b>Fechas</b>: el formulario muestra solo las que usa el reporte elegido. «Asistencia del día» usa un solo campo, <b>Día</b>. Los demás reportes usan el periodo <b>Del… al…</b>; para ver un solo día pon la misma fecha en las dos, o escribe la primera y pulsa <b>Un solo día</b>, que la copia en la segunda.</li><li><b>Materias del grupo</b>: al elegir el grupo, la lista de materias muestra solo las de ese grupo: las que tiene en tu Horario y las de clases que ya le tomaste (incluidas las extraordinarias). «Todas» las incluye todas.</li><li><b>Aviso «No hay materia asignada para el grupo…»</b>: aparece al pulsar Generar si ese grupo no tiene ninguna clase en tu Horario ni asistencias tomadas. El reporte no se genera; agrega sus clases en la pestaña Horario.</li><li>Los reportes cuentan <b>solo clases cerradas</b> (finalizadas). La excepción es «Asistencia del día», que también muestra clases abiertas.</li><li><b>Encabezado</b>: docente, escuela, grupo, periodo o día, materia y fecha de generación. Sale igual en pantalla, PDF, imagen y CSV.</li><li><b>Totales</b>: tarjetas con el número de clases, alumnos, asistencias, retardos, permisos, faltas y pendientes. Si en el periodo hay clases no impartidas, se agrega la tarjeta «No impartidas».</li><li><b>Resumen general</b>: por alumno, cuántas asistencias, retardos, permisos y faltas tuvo y el total de clases, con una fila TOTAL. En rojo, los alumnos con 3 o más faltas. <b>Si le das dos o más materias al grupo</b> y eliges «Todas», el resumen sale separado: una tabla por materia, cada una con su fila TOTAL DE LA MATERIA, y al final «Total del grupo» con la suma de todas y la fila TOTAL DEL GRUPO. Con una sola materia, o si eliges una materia, sale una sola tabla. Toca a un alumno para ver su historial (por ejemplo: 5 asistencias, 2 permisos, 1 retardo, 2 faltas) y cada registro con su fecha y materia.</li><li><b>Solo asistencias / retardos / faltas / permisos / pendientes</b>: lista cada registro de ese estado con fecha, materia, matrícula, alumno y hora.</li><li><b>Asistencia del día (por materia)</b>: elige el día en el campo «Día». Muestra a cada alumno con su estado en cada clase de ese día.</li><li><b>Clases no impartidas en los reportes</b>: no cuentan para nadie: no suman en «Clases cerradas» ni en el total de clases de cada alumno, y no generan faltas ni pendientes. Para que quede constancia, aparece la tarjeta «No impartidas» y, al final de la tabla, la sección «Clases no impartidas» con fecha, horario, materia y motivo de cada una (también en PDF, imagen y CSV). Si no hay ninguna en el periodo, el reporte sale igual que siempre.</li><li><b>Clases no impartidas</b> (tipo de reporte): lista solo esas clases del periodo, con fecha, horario, materia y motivo.</li><li><b>Exportar</b>: CSV, PDF, PNG y JPG exportan lo que ves en pantalla. El PDF sale en hojas tamaño A4; PNG y JPG son una sola imagen. El CSV no lleva colores; también aparece en el cuadro de texto para copiarlo.</li><li><b>Avisos</b>: al pulsar Generar aparece «Reporte generado» y la pantalla baja hasta el reporte. Al exportar, el aviso «Reporte exportado» indica el nombre del archivo creado.</li><li>Si el navegador no descarga el archivo, mantén presionada la imagen que aparece para guardarla, o usa el enlace para abrir el PDF.</li><li class=xls><b>Exportar para Excel</b>: genera el archivo de asistencia para el libro de calificaciones. Elige el grupo, el rango de fechas y <b>una materia</b> (no «Todas») y pulsa «Exportar para Excel»; no hace falta pulsar Generar. Incluye solo las clases cerradas. El archivo lleva una fila por alumno y por clase, con la letra que usa el libro: A = asistencia, R = retardo, P = permiso, F = falta. El nombre del archivo lleva el grupo, la materia, el periodo y el día en que lo exportaste, por ejemplo asistencia-excel_1A_PM1_2026-10-01_2026-10-31_exp-2026-10-13.csv: si exportas el mismo periodo varias veces, importa el de fecha más reciente. Envíalo a tu computadora, ábrelo con Excel y, en la hoja del grupo de tu libro, pulsa «Importar asistencia». Usa las fechas «Del… al…»: con «Asistencia del día» elegido, el botón se ve en gris; cambia a otro tipo de reporte. <b>Las clases no impartidas</b> van en el archivo aparte, una por renglón: con el Module1 v18 o posterior de tu libro se importan con la letra S para todo el grupo y sin contar como clase; con una versión anterior del libro simplemente no se importan.</li></ul>
<h3>9. Pestaña Ajustes</h3><ul><li><b>Nombre del docente</b>: escribe el nombre y pulsa Guardar. Para cambiarlo, corrige el campo y vuelve a guardar; el nombre nuevo se aplica también a las clases anteriores.</li><li><b>Tolerancia de retardo (minutos)</b>: tiempo desde el inicio de la clase en que el escaneo o la matrícula aún cuentan como asistencia. Con 0, todo registro posterior a la hora de inicio es retardo.</li><li><b>Anticipación para tomar asistencia (minutos)</b>: cuántos minutos antes de la hora de inicio aparece la clase como «Clase actual» en Hoy, con su botón TOMAR ASISTENCIA. De fábrica son 10; acepta de 0 a 240. Con 0, la clase aparece justo a su hora de inicio. Si tienes clases seguidas, la siguiente aparece cuando termina la anterior. No cambia la regla de retardo.</li><li><b>Guardar</b>: guarda el nombre, la tolerancia, la anticipación, los pendientes y el sonido. Los cambios no se aplican hasta pulsarlo.</li><li><b>Pendientes al finalizar</b>: opción sugerida al cerrar una clase (marcar falta o dejar pendientes).</li><li><b>Sonido al registrar (pitido)</b>: activa o desactiva el sonido que confirma cada registro. Al guardar con el sonido activado se escucha un pitido de prueba.</li><li><b>Tema: claro/oscuro/auto</b>: cada toque cambia entre claro, oscuro y automático (el del celular). Se aplica al momento, sin pulsar Guardar.</li><li><b>Respaldo</b>: Exportar respaldo guarda un archivo con grupos, alumnos y sus QR, horario, asistencias y configuración. Su nombre lleva la fecha y la hora, por ejemplo respaldo-asistencia_2026-10-13_1830.json, para que no se confunda con los anteriores. Si el respaldo es pequeño, también aparece en el cuadro de abajo para copiarlo; si es grande (por ejemplo, todo un semestre), el cuadro solo dice cuánto pesa: el archivo es el que cuenta. En celular o tablet se abre el menú de compartir: guárdalo en Drive, en tu correo o mándalo por WhatsApp a ti mismo (puede terminar en .json o .txt; es el mismo archivo). En computadora se descarga. «Último respaldo» solo se actualiza si de verdad lo compartiste o descargaste. Para restaurar, elige el archivo en «Restaurar un respaldo». Antes de hacer nada, la app dice de qué fecha es y cuántos alumnos y clases trae. Lo que viene en el respaldo vuelve a como estaba ese día (si lo corregiste o lo borraste después, regresa como estaba); lo que capturaste después y no viene en el respaldo se conserva. Antes de restaurar se guarda una copia: el botón «Deshacer la restauración» regresa el dispositivo a como estaba justo antes. El contenido del respaldo aparece también en el cuadro de texto, por si el navegador no descarga el archivo. Debajo del botón se ve la fecha del último respaldo hecho en este dispositivo; a los 7 días sin respaldo, Hoy muestra el aviso «Respaldo pendiente».</li><li><b>Mis dispositivos</b>: para usar la app con los mismos datos en tu celular, tu tablet y tu computadora. Botones «Enviar a mi otro dispositivo» y «Recibir de mi otro dispositivo», las líneas «Último envío» y «Última recepción» y, después de recibir, «Deshacer la última recepción». Se explica en la sección 12.</li><li><b>Ayuda</b>: Ver manual de uso abre este manual (Imprimir / PDF lo imprime o lo guarda completo; Volver regresa a donde estabas). También muestra la versión instalada y el botón Buscar actualización (ver sección 10).</li><li><b>Cámara</b> (plegada; toca su título): solo si la cámara se ve negra, parpadea o no lee bien. <b>Cámara a usar</b>: «Automática (trasera)» o una de las cámaras del aparato (sus nombres aparecen después de permitir la cámara una vez, por ejemplo con Probar cámara). <b>Resolución</b>: Automática, Alta (1280×720) o Básica (640×480). <b>Modo de vista</b>: Normal o Compatible; elige Compatible si al encender la cámara <b>toda la pantalla</b> parpadea o se pone negra (pasa en algunas tablets): la imagen se dibuja de otra forma y la lectura de códigos sigue igual. <b>Probar cámara</b> muestra la imagen en vivo con el nombre de la cámara, la resolución real y un contador de «imagen negra» y «cortes»: si tras unos segundos ambos siguen en 0, dice «✓ estable». La prueba se apaga sola a los 20 segundos; durante la prueba, «Cambiar modo de vista» pasa de Normal a Compatible y al revés. Los cambios se guardan al momento, solo en este aparato (no viajan en el respaldo ni en Mis dispositivos), y los usan pasar lista y escanear códigos de alumnos. Para volver a como estaba, deja todo en «Automática» y «Normal».</li><li><b>Libro de calificaciones de Excel</b> (plegada; toca su título): solo para el docente que usa el libro de calificaciones de Excel con macro. El interruptor «Mostrar Exportar para Excel» viene apagado: así, en Reportes no aparece «Exportar para Excel» ni su explicación en este manual. Para encenderlo, la app pide una clave; para apagarlo no. Se guarda solo en este aparato (no viaja en el respaldo ni en Mis dispositivos).</li><li><b>Borrar datos</b>: «Borrar registros de asistencia» elimina clases tomadas y registros, y conserva alumnos y horario. «Borrar todo» elimina también grupos, alumnos y horario, y deja la app sin ningún registro; conserva lo que tienes en Ajustes (nombre del docente, tolerancia, anticipación, pendientes y sonido) y el tema. Ambos son permanentes: exporta un respaldo antes. Los dos borran solo en este dispositivo (ver sección 12).</li><li><b>Acerca de la app</b>: al final de Ajustes, plegada; muestra la versión instalada. Toca la flecha para ver quién creó la app, cómo se hizo (diseño y criterio docente de su autor, con programación asistida por inteligencia artificial) y la tecnología con la que está hecha.</li><li><b>Salir de la app</b>: pide confirmación, apaga la cámara y muestra la pantalla de salida. Si el navegador lo permite, la ventana se cierra sola (Android con la app instalada). En iPhone, o si usas la app en Chrome sin instalarla, el teléfono no deja que se cierre sola: la pantalla de salida lo avisa y basta con salir como de cualquier app (deslizar hacia arriba desde el borde inferior o el botón de inicio). Tus datos quedan guardados. En la pantalla de salida, Volver a entrar abre la app de nuevo. También está el botón Salir en Hoy.</li></ul>
<h3>10. Instalar y actualizar</h3><ul><li><b>Instalar</b>: abre el enlace de la app con internet y espera a que cargue. En Android (Chrome): menú ⋮ → Instalar aplicación o Añadir a pantalla de inicio. En iPhone (Safari): Compartir → Añadir a pantalla de inicio.</li><li><b>Apertura rápida</b>: después de esa primera carga, la app instalada abre de inmediato con la copia guardada en el celular, con o sin internet.</li><li><b>Publicar una versión nueva</b> (quien administra el sitio): reemplaza en el repositorio todos los archivos del paquete, incluido version.json, y espera unos minutos a que se publiquen.</li><li><b>Aviso de versión nueva</b>: al abrir con internet, la app busca en segundo plano si hay una versión nueva. Si la hay, aparece arriba el aviso «Nueva versión disponible» con el botón Actualizar; ✕ cierra el aviso sin actualizar. Si no lo tocas, la versión nueva se aplica sola la siguiente vez que abras la app.</li><li><b>Actualizar a mano</b>: en Ajustes pulsa Buscar actualización, con internet. La app compara tu versión con la publicada: si hay una nueva, la descarga, se reinicia y avisa «App actualizada a la versión…»; si no, avisa que ya tienes la más reciente. Tus datos no se borran.</li><li><b>Versión</b>: en Ajustes, «Versión de la app» indica cuál tienes. El número sube con cada actualización (por ejemplo, de 2.0.8 a 2.0.9).</li></ul>
<h3>11. Usar la app en otro celular (otro docente)</h3><ol><li>Compártele el enlace de la app. Lo abre con internet y la instala como en la sección 10.</li><li>Escribe su nombre en la tarjeta «Nombre del docente» de Hoy.</li><li>Para que las credenciales que ya imprimiste le funcionen: tú vas a Alumnos → Compartir alumnos con QR, eliges todos los grupos o uno solo, pulsas «Exportar alumnos con QR» y le envías el archivo (se llama, por ejemplo, alumnos-qr_1A_2026-10-13.json, o alumnos-qr_todos_2026-10-13.json si son todos los grupos). Ese archivo lleva solo grupos, alumnos y su QR; no incluye asistencias, horario ni tu nombre.</li><li>Él abre el archivo en Alumnos → «Recibir de otro docente», revisa la vista previa y pulsa Confirmar importación. Si un alumno ya existía en su celular, solo se cambia su QR y se conservan sus asistencias.</li><li><b>Sin archivo, con códigos QR en pantalla</b> (si están juntos): tú eliges el grupo (o todos) y pulsas «Mostrar como código QR». Él pulsa «Escanear códigos de alumnos», luego ACTIVAR CÁMARA, y apunta a tu pantalla. Como un solo código no alcanza para muchos alumnos, la app los reparte en varios («Código 1 de 3»…): cambian solos cada 3 segundos y se repiten; con Anterior, Siguiente y Pausar/Reanudar puedes ir a uno en particular. Su celular los lee en cualquier orden, muestra cuáles ya leyó y cuáles faltan, y al completarlos abre la misma vista previa que el archivo: revisa y pulsa Confirmar importación. Funciona sin internet.</li><li><b>Con foto</b>: en lugar de ACTIVAR CÁMARA, él puede pulsar «📸 ESCANEAR CON FOTO» y tomar una foto de cada código de tu pantalla (pausa los códigos con Pausar y usa Siguiente para pasar al que falta). Cada foto suma el código leído; al completarlos se abre la vista previa.</li><li><b>Si no lee los códigos</b> (pasa con algunas tablets o con pantallas poco brillantes): sube el brillo de tu pantalla, que él ponga el código a 20–30 cm ocupando casi todo el recuadro, y pulsa «Códigos más sencillos»: salen más códigos, pero con menos datos cada uno y mucho más fáciles de leer (si él ya había leído alguno, empieza de nuevo con los nuevos). Si pasan unos segundos sin leer, su pantalla muestra estos mismos consejos. Si la cámara se corta, la app la vuelve a encender sola; si no puede, pulsa ACTIVAR CÁMARA otra vez.</li><li>Carga su propio horario.</li></ol><ul><li>Si en lugar de eso importa la lista en CSV, su celular genera códigos distintos y tendría que imprimir credenciales nuevas.</li><li>Cada celular guarda sus asistencias por separado; no se sincronizan entre sí.</li><li>El archivo y los códigos contienen datos de tus alumnos: compártelos solo con ese docente y cierra la pantalla de códigos al terminar (botón Volver).</li></ul>
<h3>12. Usar la app en varios dispositivos (el mismo docente)</h3><ul><li><b>Para qué sirve</b>: para que tú mismo veas lo mismo en tu celular, tu tablet y tu computadora: grupos, alumnos, horario, clases tomadas y reportes. No es automático: pasas un archivo de un dispositivo al otro con la tarjeta <b>Mis dispositivos</b> de la pestaña Ajustes. Para compartir alumnos con <b>otro</b> docente es la sección 11.</li><li><b>La primera vez</b>: instala la app en el segundo dispositivo y déjalo vacío (no importes ahí alumnos ni horario). En el primero pulsa «Enviar a mi otro dispositivo» y en el segundo «Recibir de mi otro dispositivo». Así los dos usan los mismos QR y las credenciales impresas sirven en ambos.</li><li><b>Enviar a mi otro dispositivo</b>: genera el archivo con todos tus datos. En celular o tablet se abre el menú de compartir: elige WhatsApp (a ti mismo), correo, Drive o lo que uses. En computadora, o si el aparato no deja compartir, el archivo se descarga. Si el menú no se abre, aparecen los botones «Compartir archivo» y «Descargar archivo». El nombre lleva la fecha y la hora, por ejemplo asistencia-dispositivos_2026-10-06_1720, y puede terminar en .json o en .txt: es el mismo archivo.</li><li><b>Qué lleva el archivo</b>: siempre todo: grupos, alumnos con su QR, horario, clases tomadas, clases no impartidas, clases sin cerrar y sus asistencias. De Ajustes viajan el nombre del docente, la tolerancia, la anticipación y los pendientes; el sonido y el tema se quedan en cada aparato.</li><li><b>Recibir de mi otro dispositivo</b>: elige el archivo donde lo hayas guardado. Aparece la vista previa: de quién es el archivo, cuándo se generó y una tabla con cuántos grupos, alumnos, clases y registros son nuevos, cuántos cambian y cuántos se borran. Nada se guarda hasta pulsar <b>Confirmar</b>; Cancelar lo deja todo como estaba. Si el dispositivo ya tiene todo, lo dice y no hay nada que confirmar.</li><li><b>Si trabajaste en los dos</b>: los datos viajan en un sentido cada vez. Envía de uno al otro y, después de recibir, envía de regreso; así los dos quedan iguales.</li><li><b>Cómo se combinan</b>: gana el cambio más reciente, dato por dato (cada alumno, cada clase y cada registro por separado), no un dispositivo completo sobre el otro. Para eso la app anota por dentro la fecha y la hora de cada cambio; lo capturado antes de la versión 2.0.7 no la tiene y cuenta como lo más antiguo; si ninguno de los dos tiene fecha, gana lo que viene en el archivo. Cada ajuste (nombre, tolerancia, anticipación, pendientes) lleva su propia fecha. Mantén la hora del aparato en automático.</li><li><b>Lo que borras</b>: lo que eliminas uno por uno (un alumno, un grupo, una clase del horario, una clase sin cerrar, una marca de «no impartida») se borra también en el otro dispositivo al recibir. Si allá lo modificaste después de haberlo borrado aquí, se conserva; y si eliminas con ✕ una clase sin cerrar que en el otro dispositivo ya habías terminado, la clase terminada también se conserva. Si el archivo trae algo que borraste en el dispositivo que recibe, no vuelve, y la vista previa lo dice. Los borrados masivos («Borrar todo», «Borrar registros de asistencia», «Borrar todos los alumnos» y «Borrar todo el horario») limpian solo el dispositivo donde los pulsas: para empezar en limpio hay que pulsarlos en cada uno. «Borrar todo» deja además el dispositivo como recién instalado: si después recibe un archivo, queda igual que el dispositivo que lo envió.</li><li><b>Lo que cargaste por separado en cada dispositivo</b>: se reconoce como lo mismo y se funde, sin duplicar: los grupos por su nombre, los alumnos por su matrícula, las clases del horario por grupo, día y hora de inicio, y las clases tomadas por grupo, fecha, materia y hora de inicio. Si un alumno tiene un QR distinto en cada dispositivo queda el del archivo, y la vista previa avisa cuántos cambian: las credenciales impresas desde el dispositivo que recibe dejan de servir para ellos. Si el alumno ya estaba en los dos y en uno le cambiaste el QR (con «Recibir de otro docente»), vale el cambio más reciente.</li><li><b>La misma clase tomada en los dos</b>: queda una sola clase con los registros de ambos; si un alumno tiene registro en los dos, gana el más reciente. Si en uno ya estaba cerrada, queda cerrada. Si en uno la marcaste «no impartida» y en el otro pasaste lista, gana la lista; una clase que solo se abrió, sin marcar a nadie y sin cerrar, no cuenta como lista y se conserva la marca.</li><li><b>Deshacer la última recepción</b>: antes de combinar, la app guarda por dentro una copia de cómo estaba el dispositivo. El botón, que muestra la fecha de esa copia, lo regresa a ese momento; lo que hayas capturado después se pierde, y lo avisa antes. Solo se guarda la última copia, y los borrados masivos la eliminan.</li><li><b>Último envío y Última recepción</b>: las dos líneas de la tarjeta indican cuándo fue la última vez que este dispositivo envió y recibió.</li><li><b>Archivos equivocados</b>: si el nombre del docente del archivo no coincide con el de este dispositivo, la app avisa y pide una confirmación aparte (no lo hace si ya habías recibido antes de ese dispositivo, por ejemplo cuando solo cambiaste tu nombre en uno). Un respaldo, un archivo de alumnos con QR o un CSV no se aceptan aquí: el aviso dice dónde se usan. Si el archivo se hizo con una versión más nueva de la app, pide actualizar primero.</li><li>El archivo contiene los datos de tus alumnos: envíatelo solo a ti.</li></ul>
<h3>13. Cuidado de tus datos</h3><ul><li>Exporta un respaldo cada semana y guárdalo fuera del celular (correo o nube).</li><li>No borres los datos de navegación del sitio ni desinstales la app sin respaldo: se perderían los registros.</li><li>Usa siempre el mismo navegador y el mismo enlace. Otro navegador u otro enlace muestran la app vacía.</li><li>Si cambias de celular: exporta el respaldo en el anterior y restáuralo en el nuevo.</li><li>Si usas varios dispositivos (sección 12), el respaldo sigue haciendo falta: pasar los datos de uno a otro no sustituye a guardar una copia fuera de ellos.</li></ul>
<h3>14. Solución de problemas</h3><ul><li><b>No aparece la clase actual</b>: revisa en Horario que la clase esté en el día correcto y que la hora actual esté entre la anticipación configurada en Ajustes (10 minutos de fábrica) antes del inicio y el término. Revisa también la hora del celular. Mientras tanto, puedes abrirla con el botón Tomar en «Mis clases de hoy».</li><li><b>Se me pasó la hora y no tomé asistencia</b>: en Hoy, en «Mis clases de hoy», pulsa Tomar en esa clase y marca a los alumnos en Ver lista. Solo aplica a las clases del día de hoy. Si no la tomas, la clase queda sin registro: no genera faltas y no aparece en los reportes<span class=xls> ni en el archivo para Excel</span>.</li><li><b>El grupo no llegó o la clase no se dio</b>: en Hoy, en «Mis clases de hoy», pulsa No impartida en esa clase y elige el motivo. Nadie recibe falta y queda constancia en los reportes (sección 4).</li><li><b>Hubo suspensión de labores</b>: en Hoy usa la tarjeta «Día sin clases»: elige la fecha y el motivo, revisa las clases y confirma. Sirve para hoy, para un día pasado o para uno futuro.</li><li><b>Marqué por error una clase como no impartida</b>: pulsa Quitar en esa clase (o en el día, en la lista de «Día sin clases»). La clase queda pendiente y, si es de hoy, ya puedes pasar lista.</li><li><b>Quiero pasar lista antes de la hora</b>: sube la anticipación en Ajustes o pulsa Tomar en esa clase.</li><li><b>El reporte dice «No hay materia asignada para el grupo…»</b>: ese grupo no tiene clases en tu Horario ni asistencias tomadas. Agrega sus clases en Horario y vuelve a generar.</li><li><b>No encuentro una materia en Reportes</b>: la lista solo muestra las materias del grupo elegido. Elige primero el grupo.</li><li><b>No veo el campo «Día» o las fechas «Del… al…» en Reportes</b>: el formulario muestra solo las fechas que usa el tipo de reporte elegido. «Día» aparece con «Asistencia del día»; «Del… al…» aparece con los demás. Cambia el tipo de reporte para ver las otras.</li><li><b>Me aparece «Respaldo pendiente» en Hoy</b>: pasaron 7 días sin respaldo en este dispositivo. Pulsa «Exportar respaldo ahora» y guarda el archivo fuera del celular (correo o nube).</li><li><b>No encuentro «Día sin clases» o «Clase extraordinaria»</b>: están al final de Hoy, plegadas; toca su título para abrirlas.</li><li><b>Quiero ver lo mismo en mi celular y en mi tablet o computadora</b>: usa la tarjeta «Mis dispositivos» de Ajustes (sección 12).</li><li><b>Recibí un archivo y los datos quedaron mal</b>: en Ajustes, en «Mis dispositivos», pulsa «Deshacer la última recepción».</li><li><b>Borré algo y volvió a aparecer al recibir</b>: los borrados masivos no viajan entre dispositivos; repítelos en cada uno. Lo que borras uno por uno sí viaja, salvo que en el otro dispositivo lo hayas modificado después.</li><li><b>El archivo de «Mis dispositivos» termina en .txt</b>: algunos celulares solo dejan compartir así. Es el mismo archivo; «Recibir» acepta las dos terminaciones.</li><li><b>Escribí mal un nombre, una matrícula o una materia</b>: usa el botón del lápiz ${PEN} en la lista de alumnos (pestaña Alumnos) o en la lista de clases (pestaña Horario).</li><li><b>Una materia sale dos veces en Reportes</b>: quedó escrita de dos formas. En Horario edita la clase con el botón del lápiz, corrige el nombre y elige «Sí, cambiar en todas».</li><li><b>Me registra retardo</b>: la hora ya pasó de la tolerancia. Cámbialo a mano en Ver lista o ajusta la tolerancia en Ajustes.</li><li><b>«QR no encontrado»</b>: la credencial se generó en otro celular. Pide al otro docente el archivo de alumnos con QR (sección 11) o imprime credenciales nuevas.</li><li><b>Pulsé Salir y la app se quedó en «Saliste de la app»</b> (pasa en iPhone, o en Chrome sin instalar): es normal, ese teléfono no permite que la app se cierre sola. Tus datos ya quedaron guardados y la cámara apagada; sal deslizando hacia arriba desde el borde inferior o con el botón de inicio.</li><li><b>La cámara no abre</b>: pulsa ACTIVAR CÁMARA y permite el uso de la cámara en el navegador. Si abriste la app como archivo suelto, usa la versión instalada o registra por matrícula o lista.</li><li><b>Toda la pantalla parpadea o se pone negra al encender la cámara</b> (no responden botones ni textos; pasa en algunas tablets): cierra la app, ábrela otra vez, ve a Ajustes › Cámara y elige «Modo de vista: Compatible» antes de encender la cámara. Luego pulsa Probar cámara (se apaga sola a los 20 s) y, si ya no parpadea, la cámara de pasar lista y la de escanear códigos funcionarán igual. Si aun así parpadea o no se ve nada (en algunas tablets Chrome no puede mostrar la cámara en vivo en ninguna página), usa el botón «📸 ESCANEAR CON FOTO»: usa la cámara normal de la tablet.</li><li><b>Solo la imagen de la cámara se ve negra o parpadea</b>: ve a Ajustes › Cámara y pulsa Probar cámara. Cambia la Resolución a «Alta (1280×720)» y observa unos segundos; si sigue igual, prueba «Básica (640×480)»; si sigue, elige otra cámara en «Cámara a usar» y repite. Quédate con la combinación que diga «✓ estable». Mientras tanto puedes registrar por matrícula o con Ver lista.</li><li><b>El CSV marca errores</b>: la vista previa dice la línea y el motivo. Corrige el archivo y vuelve a elegirlo.</li><li><b>La hora de término «debe ser posterior»</b>: el aviso muestra las horas que leyó; revisa AM/PM o escribe en formato de 24 horas (13:00).</li><li><b>La app tarda en abrir</b>: desde la versión 1.5 abre con la copia guardada sin esperar a internet. Si aún tarda, es el arranque del propio celular. No hace falta «limpiar caché»: la caché es lo que permite abrir rápido y sin internet, y tus datos no son parte de ella.</li><li><b>No veo los cambios nuevos</b>: revisa la versión en Ajustes y pulsa Buscar actualización con internet. Si dice que ya tienes la más reciente, los archivos nuevos aún no están publicados: revisa que se hayan subido todos, incluido version.json, y espera unos minutos.</li><li><b>No se escucha el async function rs2(o){toast('Restaurando…');try{const ops={},now=Date.now(),sy=await mdSync(),gone={};for(const r of await kvP(MDX))gone[r.k]=+r.v||0;const snap={t:now,sync:{...sy},kv:[]};for(const s of MDS)snap[s]=await tx(s,'readonly',x=>x.getAll());const c0=await get('kv','cfg');if(c0)snap.kv.push(c0);snap.kv.push(...await kvP(MDX));delete snap.sync.undo;delete snap.sync.undoO;let k=0;for(const s of['groups','students','classes','sessions','records','kv']){const cur=Object.create(null);for(const x of await tx(s,'readonly',q=>q.getAll()))cur[s=='kv'?x.k:x.id]=x;ops[s]={put:[],del:[]};for(const x0 of o[s]||[]){if(!x0||typeof x0!='object')continue;if(s=='kv'&&(mdIn2(x0)||x0.k==null))continue;const x={...x0},key=s=='kv'?x.k:x.id;if(key==null)continue;const e=cur[key];if(e&&mdSame(e,x))continue;/* igual que en 2.0.7: lo restaurado conserva la fecha de cambio del respaldo; si aquí se había borrado, se anota como recién puesto para que el borrado no lo vuelva a quitar */if(s!='kv'&&s!='records'){const g=gone[MDX+s+'|'+key];if(g&&g>=(+x.u||0))x.u=Math.max(now,g+1)}ops[s].put.push(x);k++}}if(!k){toast('El respaldo ya estaba igual que este dispositivo: no cambió nada.');return show()}sy.undo=now;sy.undoO='rs';ops.kv.put.push({k:'md|undo',v:snap},{k:'md|sync',v:sy});await mdBulk(ops);const c=await get('kv','cfg');if(c)cfg={...cfg,...c.v};toast('Respaldo restaurado ('+PL(k,'dato','datos')+'). Si te equivocaste de archivo, usa «Deshacer la restauración» en Ajustes › Respaldo.');show()}catch(e){toast('No se pudo restaurar: '+((e&&e.message)||'error desconocido')+'. No se cambió nada.')}}

if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
