<link rel="manifest" href="manifest.webmanifest"><meta name="theme-color" content="#1d4ed8"><link rel="apple-touch-icon" href="icon-192.png"><meta name="apple-mobile-web-app-capable" content="yes"><title>Control de Asistencia Escolar</title>
<style>
:root{--bg:#f4f6f9;--c:#fff;--t:#14213d;--m:#64748b;--p:#1d4ed8;--ok:#15803d;--wa:#b45309;--er:#b91c1c;--in:#0369a1;--b:#e2e8f0;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--p:#60a5fa;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--in:#38bdf8;--b:#334155}}
:root[data-theme=dark]{--bg:#0f172a;--c:#1e293b;--t:#f1f5f9;--m:#94a3b8;--p:#60a5fa;--ok:#4ade80;--wa:#fbbf24;--er:#f87171;--in:#38bdf8;--b:#334155}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--t);font:15px system-ui,-apple-system,Segoe UI,sans-serif;padding-bottom:76px}
#app{max-width:720px;margin:auto;padding:12px}h2,h3{margin:.3em 0}small,.m{color:var(--m)}
.card{background:var(--c);border:1px solid var(--b);border-radius:12px;padding:14px;margin:10px 0}
button,input,select,textarea{font:inherit;color:var(--t);background:var(--c);border:1px solid var(--b);border-radius:10px;padding:9px;max-width:100%}
button{cursor:pointer;background:var(--p);color:#fff;border:0;font-weight:600}button.g{background:var(--c);color:var(--t);border:1px solid var(--b)}
.big{width:100%;padding:16px;font-size:17px;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1 1 120px}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--c);border-top:1px solid var(--b);padding-bottom:env(safe-area-inset-bottom,0px)}

.cP{background:#16a34a;color:#fff}.cR{background:#facc15;color:#1f2937}.cF{background:#dc2626;color:#fff}.cJ{background:#f97316;color:#1f2937}.cN{background:#fff;color:#1f2937;border:1px solid #94a3b8}
.ch{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.tP{background:rgba(22,163,74,.16)}.tR{background:rgba(250,204,21,.28)}.tF{background:rgba(220,38,38,.14)}.tJ{background:rgba(249,115,22,.2)}th.cP,th.cR,th.cF,th.cJ{border:0}.leg{line-height:2.2;margin:6px 0}#msg small{color:inherit;opacity:.9}.sb{text-align:right;white-space:nowrap;vertical-align:middle}.sb button{padding:9px 0;width:38px;margin-left:2px}#lista .ch{margin-top:4px}
.box{border:2px solid currentColor}table{width:100%;border-collapse:collapse;font-size:13px}td,th{padding:6px 4px;border-bottom:1px solid var(--b);text-align:left}
.tbl{overflow-x:auto}button:disabled{opacity:.5}.cr{break-inside:avoid}.cr{display:inline-block;width:48%;border:1px dashed #888;border-radius:8px;padding:8px;margin:1%;text-align:center;color:#000;background:#fff}

</style></head><body><div id="app"></div>
<nav><button onclick="go('hoy')" id="t-hoy">Hoy</button><button onclick="go('alu')" id="t-alu">Alumnos</button><button onclick="go('hor')" id="t-hor">Horario</button><button onclick="go('rep')" id="t-rep">Reportes</button><button onclick="go('aju')" id="t-aju">Ajustes</button></nav>
<script src="lib/jsQR.js"></script>
<script src="lib/qrcode.js"></script>
<script>
const DB=new Promise((r,j)=>{const q=indexedDB.open('asis',1);q.onupgradeneeded=()=>{for(const s of['groups','students','classes','sessions','records','kv'])q.result.createObjectStore(s,{keyPath:s=='kv'?'k':'id'})};q.onsuccess=()=>r(q.result);q.onerror=()=>j(q.error)});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const all=async s=>{const r=await tx(s,'readonly',o=>o.getAll());return s=='groups'?r.sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true})):r},get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const clr=s=>tx(s,'readwrite',o=>o.clear());
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:var(--t);color:var(--bg);padding:12px;border-radius:10px;text-align:center';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,3500)}
function ask(t,f){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML=`<div class=card style="max-width:340px"><p>${esc(t)}</p><div class=row><button class=g id=no>Cancelar</button><button id=si style="background:var(--er)">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#si').onclick=async()=>{d.remove();await f()}}
const $=s=>document.querySelector(s),app=$('#app'),pad=n=>String(n).padStart(2,'0');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},v=id=>document.getElementById(id).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={P:['✓ Asistencia','cP'],R:['⚠ Retardo','cR'],F:['✕ Falta','cF'],J:['ⓘ Permiso','cJ']};
const LEG='<p class=leg><span class="ch cP">Asistencia</span> <span class="ch cR">Retardo</span> <span class="ch cF">Falta</span> <span class="ch cJ">Permiso</span> <span class="ch cN">Pendiente</span></p>';
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const VER='13';
let cfg={tol:10,pend:'F',crit:10,wr:1,wj:1,doc:''},tab='hoy',S=null,stream=null,scanning=false,last='',lastT=0,imp=[];
const opts=(a,f)=>a.map(f).join('');
function go(t){tab=t;S=null;stopCam();show()}
async function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t-'+tab));app.innerHTML=await({hoy,alu,hor,rep,aju}[tab])()}
async function saveFile(n,data){try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:n,data});toast('Archivo guardado: '+n);return true}}}catch(e){if(e&&e.code=='declined'){toast('Descarga cancelada');return false}}
try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=n;document.body.appendChild(a);a.click();a.remove();return true}catch(x){toast('No se pudo descargar: usa la vista previa o copia el texto');return false}}
function dl(n,t){const e=$('#exp');if(e)e.value=t;saveFile(n,n.endsWith('.csv')?'﻿'+t:t)}
/* HOY */
async function hoy(){const[cl,gs,ss,st]=await Promise.all([all('classes'),all('groups'),all('sessions'),all('students')]);
const now=new Date(),t=hm(now),today=ymd(now),g=id=>(gs.find(x=>x.id==id)||{}).name||'?';
const mine=cl.filter(c=>c.day==now.getDay()).sort((a,b)=>a.start.localeCompare(b.start));
const done=c=>ss.find(s=>s.date==today&&(s.cid==c.id||s.gid==c.gid&&s.subject==c.subject&&s.start==c.start));
const cur=mine.find(c=>mins(t)<mins(c.end)&&mins(c.start)-mins(t)<=10),nxt=mine.find(c=>c!=cur&&c.start>t);
const info=c=>`${esc(c.subject)}</h3><p>${esc(g(c.gid))} · ${c.start}–${c.end} · ${st.filter(x=>x.gid==c.gid).length} alumnos</p>`;
let h=`<h2>${DAYS[now.getDay()]} ${today} · ${t}</h2>`+(cfg.doc?`<p class=m>Docente: ${esc(cfg.doc)}</p>`:`<div class=card><b>Nombre del docente</b><p class=m>Aparecerá en los reportes. Puedes cambiarlo después en Ajustes.</p><div class=row><input id=dn placeholder="Nombre completo del docente" autocomplete=name><button onclick="saveDoc()">Guardar</button></div></div>`);
if(cur){const d=done(cur);h+=`<div class=card><small>CLASE ACTUAL</small><h3>${info(cur)}<button class=big ${d&&d.closed?'disabled':''} onclick="openC('${cur.id}')">${d?d.closed?'✓ ASISTENCIA REGISTRADA':'CONTINUAR ASISTENCIA':'TOMAR ASISTENCIA'}</button></div>`}else h+=`<div class="card m">No hay clase en este momento.</div>`;
if(nxt)h+=`<div class=card><small>PRÓXIMA CLASE</small><h3>${info(nxt)}</div>`;
h+=`<div class=card><b>Mis clases de hoy</b>`+(mine.length?opts(mine,c=>{const d=done(c);return`<p>${d&&d.closed?'<span class=ok>✓</span>':'○'} ${c.start} — ${esc(c.subject)} — ${esc(g(c.gid))}</p>`}):'<p class=m>Sin clases. Agrégalas en Horario.</p>')+`</div>`;
h+=`<div class=card><b>Clase extraordinaria / sustitución</b><div class=row><select id=xg>${opts(gs,x=>`<option value=${x.id}>${esc(x.name)}</option>`)}</select><input id=xs placeholder="Materia"></div><button class=g onclick="openX()">Iniciar ahora (50 min)</button></div>`;return h}
async function openC(cid){const c=await get('classes',cid),today=ymd(new Date()),gs=await all('groups');
let s=(await all('sessions')).find(x=>x.date==today&&(x.cid==cid||x.gid==c.gid&&x.subject==c.subject&&x.start==c.start));
if(!s){s={id:uid(),cid,gid:c.gid,gname:(gs.find(x=>x.id==c.gid)||{}).name||'?',subject:c.subject,date:today,start:c.start,end:c.end,closed:false,teacher:cfg.doc||''};await put('sessions',s)}
S=s;att()}
async function openX(){if(!$('#xg')||!v('xg')||!v('xs').trim())return toast('Elige grupo y escribe la materia');const gs=await all('groups'),n=new Date(),e=new Date(n.getTime()+3e6);
S={id:uid(),cid:null,gid:v('xg'),gname:gs.find(x=>x.id==v('xg')).name,subject:v('xs').trim(),date:ymd(n),start:hm(n),end:hm(e),closed:false,teacher:cfg.doc||''};await put('sessions',S);att()}
/* ASISTENCIA */
async function att(){const A=await all('students');TK={};AM={};A.forEach(x=>{TK[x.token]=x;AM[x.mat]=x});S.st=A.filter(x=>x.gid==S.gid).sort((a,b)=>a.name.localeCompare(b.name));S.map={};(await all('records')).filter(r=>r.sid==S.id).forEach(r=>S.map[r.stid]=r);
app.innerHTML=`<div class=card><h3>${esc(S.subject)} · ${esc(S.gname)}</h3><small>${S.date} · ${S.start}–${S.end} · <span id=net></span> · Tolerancia ${cfg.tol} min</small><h2 id=cnt></h2>${S.st.length?'':'<p class=er>Este grupo no tiene alumnos.</p>'}
<video id=v playsinline muted></video><canvas id=cv hidden></canvas><div id=msg class=m>Apunta la cámara al QR de la credencial</div>
<div class=row><input id=mat placeholder="Matrícula" autocomplete=off onkeydown="if(event.key=='Enter')byMat()"><button onclick="byMat()">INTRODUCIR MATRÍCULA</button></div>
<div class=row><button class=g onclick="lst()">VER LISTA</button><button onclick="fin()">FINALIZAR</button><button class=g onclick="go('hoy')">Salir</button></div><div id=lista></div><div id=fin></div></div>`;
upNet();cnt();startCam()}function upNet(){const n=$('#net');if(n)n.textContent=navigator.onLine?'🟢 En línea (datos locales)':'🟠 Sin conexión (todo se guarda local)'}addEventListener('online',upNet);addEventListener('offline',upNet);
const cnt=()=>{const c=$('#cnt');if(c)c.textContent=Object.keys(S.map).length+' / '+S.st.length};
async function startCam(){noCam=false;try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'}});const e=$('#v');e.srcObject=stream;await e.play();scanning=true;loop(++LID);try{wl=await navigator.wakeLock.request('screen')}catch(z){}}catch(e){noCam=true;msg('Cámara no disponible: usa matrícula o lista','er')}}
function stopCam(){scanning=false;LID++;try{wl&&wl.release()}catch(e){}wl=null;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}}
let det=null;try{if('BarcodeDetector'in window)det=new BarcodeDetector({formats:['qr_code']})}catch(e){}
let LID=0,noCam=false,wl=null,TK={},AM={};
async function loop(id){if(!scanning||id!=LID)return;const e=$('#v');if(e&&e.readyState>=2&&e.videoWidth){let x=null;
if(det){try{const r=await det.detect(e);x=r[0]&&r[0].rawValue}catch(z){det=null}}
if(!x&&!det&&window.jsQR){const c=$('#cv'),k=c.getContext('2d',{willReadFrequently:true}),w=Math.min(640,e.videoWidth);c.width=w;c.height=Math.round(w*e.videoHeight/e.videoWidth);k.drawImage(e,0,0,c.width,c.height);const i=k.getImageData(0,0,c.width,c.height),q=jsQR(i.data,i.width,i.height);x=q&&q.data}
if(x&&(x!=last||Date.now()-lastT>3000)){last=x;lastT=Date.now();try{await scanTok(x)}catch(z){}}}setTimeout(()=>loop(id),150)}
let mt;function msg(t,c){const m=$('#msg');if(m){m.className='box '+c;m.innerHTML=t;clearTimeout(mt);mt=setTimeout(()=>{const x=$('#msg');if(x){x.className='m';x.textContent=noCam?'Cámara no disponible: usa matrícula o lista':'Apunta la cámara al QR de la credencial'}},3500)}}
let AC;function beep(ok){try{AC=AC||new AudioContext();if(AC.state=='suspended')AC.resume();const o=AC.createOscillator();o.frequency.value=ok?880:220;o.connect(AC.destination);o.start();o.stop(AC.currentTime+.12)}catch(e){}}
async function scanTok(tok){const s=TK[tok];if(!s){beep(0);return msg('QR NO ENCONTRADO','er')}if(s.gid!=S.gid){beep(0);return msg('EL ALUMNO NO PERTENECE A ESTE GRUPO<br>'+esc(s.name),'er')}mark(s)}
function byMat(){const m=v('mat').trim();if(!m)return;const s=S.st.find(x=>x.mat==m);$('#mat').value='';if(s)return mark(s);msg(AM[m]?'EL ALUMNO NO PERTENECE A ESTE GRUPO':'MATRÍCULA NO ENCONTRADA','er')}
async function mark(s,status,manual){if(S.closed)return;const ex=S.map[s.id];
if(ex&&!manual){beep(0);return msg(`ASISTENCIA YA REGISTRADA<br>${esc(s.name)} · primer registro ${ex.time}`,'wa')}
const n=new Date();status=status||(mins(hm(n))>mins(S.start)+cfg.tol?'R':'P');
const r={id:S.id+'|'+s.id,sid:S.id,stid:s.id,status,time:ex?ex.time:hm(n)};await put('records',r);S.map[s.id]=r;cnt();beep(1);
msg(`${ST[status][0].toUpperCase()}<br>${esc(s.name)}<br><small>Matrícula ${esc(s.mat)} · ${r.time}</small>`,ST[status][1]);if($('#lista').innerHTML)lst(1)}
function lst(keep){const l=$('#lista');if(l.innerHTML&&!keep){l.innerHTML='';return}
l.innerHTML=LEG+`<div class=tbl><table>${opts(S.st,s=>{const r=S.map[s.id];return`<tr><td>${esc(s.name)}<br><small>${esc(s.mat)}</small><br>${r?`<span class="ch ${ST[r.status][1]}">${ST[r.status][0]} ${r.time}</span>`:'<span class="ch cN">Pendiente</span>'}</td><td class=sb>${['P','R','F','J'].map(k=>`<button class="${ST[k][1]}" style="${r&&r.status!=k?'opacity:.3':''}" title="${ST[k][0].slice(2)}" onclick="setS('${s.id}','${k}')">${{P:'A',R:'R',F:'F',J:'P'}[k]}</button>`).join(' ')}</td></tr>`})}</table></div>`}
const setS=(id,k)=>mark(S.st.find(x=>x.id==id),k,1);
function fin(){const c={P:0,R:0,F:0,J:0};Object.values(S.map).forEach(r=>c[r.status]++);const p=S.st.length-Object.keys(S.map).length;
$('#fin').innerHTML=`<div class=card><b>${S.st.length} alumnos</b><p class=leg><span class="ch cP">${c.P} asistencias</span> <span class="ch cR">${c.R} retardos</span> <span class="ch cF">${c.F} faltas</span> <span class="ch cJ">${c.J} permisos</span> <span class="ch cN">${p} pendientes</span></p>${p?`<button class=big onclick="close_(1)">MARCAR COMO FALTA${cfg.pend=='F'?' (predeterminado)':''}</button><button class="big g" onclick="close_(0)">DEJAR PENDIENTES${cfg.pend=='N'?' (predeterminado)':''}</button>`:`<button class=big onclick="close_(0)">CERRAR SESIÓN</button>`}</div>`}
async function close_(f){if(f)for(const s of S.st)if(!S.map[s.id])await put('records',{id:S.id+'|'+s.id,sid:S.id,stid:s.id,status:'F',time:hm(new Date())});
S.closed=true;const{st,map,...c}=S;await put('sessions',c);go('hoy')}
/* ALUMNOS */
async function alu(){const[gs,st]=await Promise.all([all('groups'),all('students')]);
return`<div class=card><b>Grupos</b><div class=row><input id=gn placeholder="Ej. 3°A"><button onclick="addG()">Agregar grupo</button></div>${opts(gs,g=>`<p>${esc(g.name)} · ${st.filter(x=>x.gid==g.id).length} alumnos <button class=g onclick="cred('${g.id}')">Credenciales</button> <button class=g onclick="delG('${g.id}')">✕</button></p>`)}</div>
<div class=card><b>Nuevo alumno</b><div class=row><input id=sm placeholder="Matrícula"><input id=sn placeholder="Nombre completo"><select id=sg>${opts(gs,g=>`<option value=${g.id}>${esc(g.name)}</option>`)}</select></div><button onclick="addS()">Guardar alumno</button></div>
<div class=card><b>Importar CSV</b> <small>Columnas: Matrícula, Nombre, Grupo. Cada alumno va a su grupo; los grupos que no existan se crean solos.</small><input type=file id=fi accept=".csv,.txt" onchange="fileIn(this)"><textarea id=ci rows=4 style="width:100%" placeholder="Matrícula,Nombre,Grupo&#10;20261234,Juan Pérez López,3A"></textarea><button class=g onclick="prev()">Vista previa</button><div id=pv></div></div>
<div class=card><b>${st.length} alumnos</b><div class=tbl><table>${opts(st.map(s=>[(gs.find(g=>g.id==s.gid)||{}).name||'',s]).sort((a,b)=>a[0].localeCompare(b[0],'es',{numeric:true})||a[1].name.localeCompare(b[1].name)).map(x=>x[1]),s=>`<tr><td>${esc(s.mat)}</td><td>${esc(s.name)}</td><td>${esc((gs.find(g=>g.id==s.gid)||{}).name||'')}</td><td><button class=g onclick="delS('${s.id}')">✕</button></td></tr>`)}</table></div></div>`}
const addG=async()=>{const n=v('gn').trim();if(n){await put('groups',{id:uid(),name:n});show()}};
const delG=async id=>{const n=(await all('students')).filter(s=>s.gid==id);ask(n.length?`El grupo tiene ${n.length} alumnos. Se borrarán también sus alumnos, clases y registros de asistencia.`:'¿Eliminar grupo?',async()=>{const ss=(await all('sessions')).filter(x=>x.gid==id),ids=new Set(ss.map(x=>x.id));for(const r of await all('records'))if(ids.has(r.sid))await del('records',r.id);for(const x of ss)await del('sessions',x.id);for(const x of n)await del('students',x.id);for(const c of await all('classes'))if(c.gid==id)await del('classes',c.id);await del('groups',id);show()})};
const delS=id=>ask('¿Eliminar alumno y sus registros de asistencia?',async()=>{for(const r of await all('records'))if(r.stid==id)await del('records',r.id);await del('students',id);show()});
async function addS(){const m=v('sm').trim(),n=v('sn').trim();if(!m||!n||!v('sg'))return toast('Completa matrícula, nombre y grupo');if((await all('students')).some(s=>s.mat==m))return toast('Matrícula duplicada');await put('students',{id:uid(),mat:m,name:n,gid:v('sg'),token:uid()});show()}
const gk=x=>String(x||'').toUpperCase().replace(/[\s°º.\-_]/g,'');
function csvRows(t){t=t.replace(/^﻿/,'');const f=t.split(/\r?\n/)[0]||'',n=c=>f.split(c).length-1,d=n(';')>n(',')&&n(';')>=n('\t')?';':n('\t')>n(',')?'\t':',';
const out=[];let r=[],c='',q=false;const end=()=>{r.push(c);c='';if(r.some(x=>x.trim()))out.push(r.map(x=>x.trim()));r=[]};

if(first){c.font='bold 24px '+FN;c.fillText(XT.title,M,40);c.fillStyle='#475569';XT.meta.forEach((m,i)=>{c.font=(i==0?'bold ':'')+'14px '+FN;c.fillText(fit(c,m,W-2*M),M,70+i*20)});c.fillStyle='#14213d';c.font='bold 15px '+FN;
XT.sum.forEach((x,i)=>{const sx=M+(i%3)*313,sy=168+Math.floor(i/3)*34;let o=0;if(x[3]){c.fillStyle=COL[x[3]][0];c.fillRect(sx,sy-8,16,16);if(x[3]=='cN'){c.strokeStyle='#94a3b8';c.lineWidth=1;c.strokeRect(sx+.5,sy-7.5,15,15)}o=24}c.fillStyle='#14213d';c.font='bold 15px '+FN;c.fillText(fit(c,x[0]+': '+x[1]+(x[2]!=null?' ('+x[2]+'%)':''),300-o),sx+o,sy)});
let lx=M;for(const[t,k]of[['Asistencia','cP'],['Retardo','cR'],['Falta','cF'],['Permiso','cJ'],['Pendiente','cN']])lx+=pill(c,lx,306,t,k)+8;if(XT.note){c.font='14px '+FN;c.fillStyle='#14213d';c.fillText(XT.note,M,336)}y=358}
else{c.font='bold 16px '+FN;c.fillText(XT.title+' (cont. '+pn+')',M,32);y=56}
const cw=layout();c.fillStyle='#e2e8f0';c.fillRect(M,y,W-2*M,RH);c.font='bold 14px '+FN;let x=M;XT.h.forEach((h,i)=>{const k=XT.hc[i];if(k){c.fillStyle=COL[k][0];c.fillRect(x,y,cw[i],RH)}c.fillStyle=k?COL[k][1]:'#14213d';c.fillText(fit(c,h,cw[i]-12),x+6,y+RH/2);x+=cw[i]});
d.forEach((r,j)=>{const yy=y+RH*(j+1);let x=M;r.forEach((t,i)=>{t=String(t);const k=ccl(i,t);if(k)pill(c,x+4,yy+RH/2,t,k,cw[i]-8);else{if(XT.hc[i]){c.globalAlpha=.2;c.fillStyle=COL[XT.hc[i]][0];c.fillRect(x,yy,cw[i],RH);c.globalAlpha=1}c.fillStyle=al[j]?'#b91c1c':'#14213d';c.font=(bd[j]?'bold ':'')+'14px '+FN;c.fillText(fit(c,t,cw[i]-12),x+6,yy+RH/2)}x+=cw[i]});c.strokeStyle='#cbd5e1';c.lineWidth=1;c.beginPath();c.moveTo(M,yy+RH);c.lineTo(W-M,yy+RH);c.stroke()});return cs}
function pages(){const ps=[],P1=Math.floor((PH-40-358-RH)/RH),P2=Math.floor((PH-40-56-RH)/RH),t=XT.d.length;let a=0,n=1;do{const b=Math.min(t,a+(n==1?P1:P2));ps.push(paint(XT.d.slice(a,b),XT.al.slice(a,b),XT.bd.slice(a,b),n==1,PH,n));a=b;n++}while(a<t);return ps}
function exp_img(f){if(!XT)return toast('Genera el reporte primero');const t=XT.d.length,j=f=='jpg',H=358+RH*(t+1)+40;if(H>16000)return toast('Demasiadas filas para una imagen: usa PDF');
paint(XT.d,XT.al,XT.bd,true,H,1).toBlob(b=>{if(!b)return toast('No se pudo crear la imagen: usa PDF');const u=URL.createObjectURL(b);saveFile('reporte.'+(j?'jpg':'png'),b);$('#prev').innerHTML=`<p class=m>Si no se descargó, mantén presionada la imagen para guardarla.</p><img src="${u}" style="width:100%;background:#fff">`},j?'image/jpeg':'image/png',.92)}
function exp_pdf(){if(!XT)return toast('Genera el reporte primero');const ps=pages(),enc=new TextEncoder(),parts=[],off=[],N=ps.length;let len=0;
const add=x=>{const b=typeof x=='string'?enc.encode(x):x;parts.push(b);len+=b.length},obj=(n,x)=>{off[n]=len;add(n+' 0 obj\n'+x+'\nendobj\n')};
add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Count '+N+'/Kids['+ps.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
ps.forEach((cs,i)=>{const by=Uint8Array.from(atob(cs.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0)),p=3+3*i,st='q 595 0 0 842 0 0 cm /Im0 Do Q';
obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');obj(p+1,'<</Length '+st.length+'>>\nstream\n'+st+'\nendstream');
off[p+2]=len;add((p+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+cs.width+'/Height '+cs.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+by.length+'>>\nstream\n');add(by);add('\nendstream\nendobj\n')});
const xr=len,tot=3*N+3;add('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let k=1;k<tot;k++)add(String(off[k]).padStart(10,'0')+' 00000 n \n');add('trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
const bl=new Blob(parts,{type:'application/pdf'}),u=URL.createObjectURL(bl);saveFile('reporte.pdf',bl);$('#prev').innerHTML=`<p>Si no se descargó: <a href="${u}" target="_blank">abrir el PDF</a></p>`}
async function hist(id){const s=await get('students',id),ss=Object.fromEntries((await all('sessions')).map(x=>[x.id,x])),rc=(await all('records')).filter(r=>r.stid==id&&ss[r.sid]).sort((a,b)=>(ss[b.sid].date+b.time).localeCompare(ss[a.sid].date+a.time));
const n=Object.values(ss).filter(x=>x.gid==s.gid&&x.closed).length,k={P:0,R:0,F:0,J:0};rc.filter(r=>ss[r.sid].closed).forEach(r=>k[r.status]++);const pts=n?Math.round(cfg.crit*(k.P+cfg.wr*k.R+cfg.wj*k.J)/n*100)/100:0;
$('#hist').innerHTML=`<h3>${esc(s.name)} · ${esc(s.mat)}</h3><p><b>${k.P} asistencias, ${k.J} permisos, ${k.R} retardos, ${k.F} faltas</b> de ${n} clases con lista · <b>${pts} de ${cfg.crit} puntos</b></p><table>${opts(rc,r=>`<tr><td>${ss[r.sid].date}</td><td>${esc(ss[r.sid].subject)}</td><td>${r.time}</td><td><span class="ch ${ST[r.status][1]}">${ST[r.status][0]}</span></td></tr>`)}</table>`}
const wipe=k=>ask(k?'Se borrarán todas las sesiones y registros de asistencia (los alumnos se conservan).':'Se borrarán TODOS los datos de la app.',async()=>{for(const x of k?['sessions','records']:['groups','students','classes','sessions','records'])await clr(x);toast('Datos borrados');show()});
function man(){app.innerHTML=`<div class=np><button onclick="window.print()">Imprimir / PDF</button> <button class=g onclick="go('aju')">Volver</button></div><div class=card><h2>Manual de uso</h2>
<h3>Primeros pasos (una sola vez)</h3><ol><li><b>Nombre del docente</b>: escríbelo en la tarjeta que aparece en Hoy (o en Ajustes). Saldrá en todos los reportes.</li><li><b>Alumnos</b>: crea tus grupos (ej. 3°A).</li><li>Agrega alumnos uno a uno o impórtalos por CSV.</li><li>Pulsa <b>Credenciales</b> en el grupo, imprime o guarda en PDF y entrega a cada alumno.</li><li><b>Horario</b>: captura tus clases (grupo, materia, día, hora).</li><li><b>Ajustes</b>: define la tolerancia de retardo.</li></ol>
<h3>Pestaña Hoy</h3><ul><li><b>Clase actual</b>: aparece desde 10 min antes de que empiece. Botón TOMAR ASISTENCIA (o CONTINUAR si la dejaste abierta). Cuando ya cerraste, dice ✓ ASISTENCIA REGISTRADA.</li><li><b>Próxima clase</b> y <b>Mis clases de hoy</b>: ✓ cerrada, ○ pendiente. La pantalla se actualiza sola.</li><li><b>Clase extraordinaria</b>: elige grupo, escribe la materia e inicia (sustitución, recuperación, actividad especial).</li></ul>
<h3>Pantalla de asistencia</h3><ul><li><b>Cámara</b>: acerca el QR de la credencial; registra y sigue escaneando. Verás ✓ y el nombre. Si ya estaba registrado, muestra la hora del primer registro. Si es de otro grupo o no existe, lo avisa y no guarda.</li><li><b>Contador</b> 28 / 35: alumnos registrados.</li><li><b>Introducir matrícula</b>: escribe y pulsa Enter.</li><li><b>Ver lista</b>: botones A (asistencia, verde), R (retardo, amarillo), F (falta, rojo) y P (permiso, naranja) para corregir a mano; el estado actual queda resaltado y quien aún no tiene registro aparece como «Pendiente» en blanco.</li><li><b>Colores</b>: verde = asistencia, amarillo = retardo, rojo = falta, naranja = permiso, blanco = pendiente. Son los mismos en la lista, la confirmación del escaneo, el historial y los reportes (pantalla, PDF, PNG y JPG).</li><li><b>Finalizar</b>: muestra el resumen. Los pendientes se marcan como falta o se dejan abiertos. Al cerrar ya no se modifica.</li><li><b>Salir</b>: regresa sin cerrar; puedes continuar después.</li></ul>
<h3>Pestaña Alumnos</h3><ul><li><b>Grupos</b>: agregar, Credenciales (QR con nombre y matrícula; Imprimir / PDF) y ✕ para eliminar (borra también sus alumnos, clases y registros, pide confirmación).</li><li><b>Nuevo alumno</b>: matrícula única, nombre y grupo.</li><li><b>Importar CSV</b>: columnas Matrícula, Nombre, Grupo (puede traer a todos los grupos en un solo archivo: cada alumno se asigna al grupo de su fila y los grupos que no existan se crean automáticamente; «3A» y «3°A» cuentan como el mismo grupo). Al elegir el archivo verás una vista previa con cuántos alumnos van a cada grupo y los errores (duplicados, campos faltantes). Nada se guarda hasta Confirmar importación. Acepta separador coma, punto y coma o tabulador.</li><li><b>Lista</b>: ✕ elimina un alumno y sus registros.</li></ul>
<h3>Pestaña Horario</h3><ul><li>Agrega clases con grupo, materia, día y horas; ✕ las elimina. De aquí sale la clase actual de Hoy.</li><li><b>Importar horario CSV</b>: columnas Grupo, Materia, Día, Inicio, Término (una fila por clase). El día puede ser Lunes, Lun, L o un número (1 = lunes … 6 = sábado, 7 = domingo; X = miércoles). Las horas pueden ser 07:00, 7:00 o 1:30 pm. Los grupos que no existan se crean solos. La vista previa muestra las clases por día, avisa si dos clases se empalman y marca errores por línea; nada se guarda hasta Confirmar importación. Volver a importar el mismo archivo no duplica clases.</li><li><b>Borrar todo el horario</b>: quita todas las clases para cargar un horario nuevo; las asistencias ya registradas se conservan.</li></ul>
<h3>Pestaña Reportes</h3><ul><li>Elige grupo, rango de fechas y (opcional) materia. Solo cuenta clases cerradas. El encabezado del reporte muestra el docente, el grupo, el periodo y la materia.</li><li><b>Resumen general</b>: por alumno, cuántas asistencias, retardos, permisos y faltas tuvo en el total de clases, y su <b>% de asistencia</b> y sus <b>puntos</b>. Ejemplo (criterio de 10): en 10 clases, 10 asistencias = 10 puntos; 5 asistencias, 2 permisos, 1 retardo y 2 faltas = (5 + 2×valor de permiso + 1×valor de retardo) ÷ 10 × 10 (con retardo y permiso valiendo 1: (5+2+1) ÷ 10 × 10 = 8 puntos; solo las 2 faltas restan). Es proporcional al número de veces que se pasó lista. Rojo: 3 o más faltas o menos de 80 % de los puntos. Toca un alumno para ver su historial, con su resumen (por ejemplo: 5 asistencias, 2 permisos, 1 retardo, 2 faltas).</li><li><b>Asistencia del día (por materia)</b>: elige el día en «Día», el grupo y, si quieres, la materia. Muestra cada alumno con su estado en cada clase de ese día.</li><li><b>Solo asistencias / retardos / faltas / permisos / pendientes</b>: lista cada registro de ese estado (fecha, materia, alumno, hora).</li><li><b>Totales y porcentajes</b>: arriba verás tarjetas con clases, alumnos, asistencias, retardos, permisos, faltas y pendientes, cada una con su %, más el promedio de puntos del grupo. La tabla termina con una fila TOTAL / PROMEDIO.</li><li><b>CSV, PDF, PNG, JPG</b>: exportan lo que ves en pantalla. El PDF sale en páginas A4; PNG y JPG son una sola imagen. Si el navegador bloquea la descarga, mantén presionada la imagen mostrada para guardarla, o usa el enlace para abrir el PDF.</li></ul>
<h3>Pestaña Ajustes</h3><ul><li><b>Nombre del docente</b>: aparece en Hoy y en el encabezado de los reportes (pantalla, PDF, PNG, JPG y CSV). Cada clase guarda el nombre del docente que tomó la asistencia; si corriges el nombre, se actualiza también en las clases anteriores.</li><li><b>Tolerancia</b>: minutos después del inicio en que aún cuenta como asistencia.</li><li><b>Criterio de asistencia</b>: puntos totales (normalmente 10), valor de un retardo y de un permiso entre 0 y 1 (1 = cuenta como asistencia completa, 0 = no suma; sugeridos: retardo 1 y permiso 1, así solo la falta resta puntos). Una falta no suma.</li><li><b>Pendientes al finalizar</b>: marcar falta o dejar pendientes (opción sugerida al cerrar).</li><li><b>Tema</b>: claro, oscuro o automático.</li><li><b>Versión de la app</b>: el número indica qué versión tienes instalada. <b>Buscar actualización</b> (con internet) descarga la versión más reciente publicada; tus datos no se borran.</li><li><b>Respaldo</b>: Exportar guarda un archivo (incluye la configuración y el nombre del docente); elige el archivo para restaurar.</li><li><b>Borrar datos</b>: solo registros de asistencia, o todo. Es permanente.</li></ul>
<h3>Importante</h3><ul><li>Los datos viven solo en este celular y navegador. Haz respaldo cada semana.</li><li>No borres los datos del navegador.</li><li>Si usas la versión web con enlace, ábrela con internet antes de clase; la versión instalada o el archivo sin internet no lo necesita.</li></ul></div>`}
/* AJUSTES */
async function aju(){return`<div class=card><b>Configuración</b><div class=row><label style="flex:1 1 100%">Nombre del docente (aparece en los reportes)<input id=cd value="${esc(cfg.doc||'')}" placeholder="Nombre completo" autocomplete=name style="width:100%"></label></div><div class=row><label>Tolerancia de retardo (min)<input type=number id=ct min=0 value=${cfg.tol}></label><label>Pendientes al finalizar<select id=cp><option value=F ${cfg.pend=='F'?'selected':''}>Marcar falta</option><option value=N ${cfg.pend=='N'?'selected':''}>Dejar pendientes</option></select></label></div><div class=row><label>Puntos del criterio de asistencia<input type=number id=cc min=1 value=${cfg.crit}></label><label>Valor de un retardo (0 a 1)<input type=number id=cw step=0.1 min=0 max=1 value=${cfg.wr}></label><label>Valor de un permiso (0 a 1)<input type=number id=cj step=0.1 min=0 max=1 value=${cfg.wj}></label></div><button onclick="saveC()">Guardar</button> <button class=g onclick="theme()">Tema: claro/oscuro/auto</button></div>
<div class=card><b>Respaldo</b><p class=m>Los datos viven solo en este dispositivo. Haz respaldos periódicos.</p><button onclick="bk()">Exportar respaldo</button> <input type=file accept=.json onchange="rs(this)"><textarea id=exp rows=3 style="width:100%;margin-top:8px" readonly></textarea></div><div class=card><b>Ayuda</b><p class=m>Manual paso a paso (funciona sin internet).</p><button onclick="man()">Ver manual de uso</button><p class=m>Versión de la app: <b id=ver>${VER}</b></p><button class=g onclick="upd()">Buscar actualización</button></div><div class=card><b>Borrar datos</b><p class=m>Acciones permanentes. Exporta un respaldo antes.</p><button class=g onclick="wipe(1)">Borrar registros de asistencia</button> <button style="background:var(--er)" onclick="wipe(0)">Borrar todo</button></div>`}
async function setDoc(n){n=(n||'').trim();const old=cfg.doc||'';if(n==old)return;cfg.doc=n;for(const x of await all('sessions'))if(!x.teacher||x.teacher==old){x.teacher=n;await put('sessions',x)}}
async function saveDoc(){const n=v('dn').trim();if(!n)return toast('Escribe el nombre del docente');await setDoc(n);await put('kv',{k:'cfg',v:cfg});toast('Guardado');show()}
async function saveC(){cfg={tol:+v('ct')||0,pend:v('cp'),crit:+v('cc')||10,wr:Math.min(1,Math.max(0,+v('cw')||0)),wj:Math.min(1,Math.max(0,+v('cj')||0)),doc:cfg.doc||''};await setDoc(v('cd'));await put('kv',{k:'cfg',v:cfg});toast('Guardado')}
async function upd(){if(!navigator.onLine)return toast('Conéctate a internet para actualizar');toast('Buscando actualización…');try{if('serviceWorker'in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}location.reload()}
function theme(){const r=document.documentElement,n={auto:'light',light:'dark',dark:'auto'}[r.dataset.theme||'auto'];n=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}}
async function bk(){const o={};for(const s of['groups','students','classes','sessions','records','kv'])o[s]=await all(s);dl('respaldo-asistencia.json',JSON.stringify(o))}
function rs(i){const f=i.files[0];if(!f)return;ask('Esto agrega/actualiza registros del respaldo. ¿Continuar?',()=>rs2(f))}function rs2(f){const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);for(const s of['groups','students','classes','sessions','records','kv'])for(const x of o[s]||[])await put(s,x);const c=await get('kv','cfg');if(c)cfg={...cfg,...c.v};toast('Restaurado');show()}catch(e){toast('Archivo inválido')}};r.readAsText(f)}
setInterval(()=>{const a=document.activeElement;if(tab=='hoy'&&!S&&!(a&&/INPUT|SELECT/.test(a.tagName))&&!($('#xs')&&$('#xs').value))show()},30000);(async()=>{try{const t=localStorage.getItem('th');if(t&&t!='auto')document.documentElement.dataset.theme=t}catch(e){}try{navigator.storage.persist()}catch(e){}const c=await get('kv','cfg');if(c)cfg={...cfg,...c.v};show()})();
if('serviceWorker'in navigator){const had=!!navigator.serviceWorker.controller;navigator.serviceWorker.addEventListener('controllerchange',()=>{if(had&&!window.__rl&&!S){window.__rl=1;location.reload()}});addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}))}
</script></body></html>
