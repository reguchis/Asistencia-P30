<style>

.big{width:100%;padding:16px;font-size:17px;margin-top:8px}.row{display:flex;gap:8px;flex-wrap:wrap;margin:6px 0}.row>*{flex:1 1 120px}

.ch{display:inline-block;padding:2px 9px;border-radius:999px;font-weight:600;font-size:13px;white-space:nowrap}.sw{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-1px;margin-right:6px}
.tP{background:rgba(22,163,74,.16)}.tR{background:rgba(250,204,21,.28)}.tF{background:rgba(220,38,38,.14)}.tJ{background:rgba(249,115,22,.2)}th.cP,th.cR,th.cF,th.cJ{border:0}.leg{line-height:2.2;margin:6px 0}.man li{margin:6px 0;line-height:1.45}.man h3{margin-top:20px}.man ul,.man ol{padding-left:20px}#msg small{color:inherit;opacity:.9}.sb{text-align:right;white-space:nowrap;vertical-align:middle}.sb button{padding:9px 0;width:38px;margin-left:2px}#lista .ch{margin-top:4px}.lh{display:flex;justify-content:space-between;align-items:center;gap:8px}.lt{margin-top:8px}.lt th{color:var(--m);font-size:12px;text-transform:uppercase;letter-spacing:.04em;border-bottom:2px solid var(--b)}.lt td{vertical-align:middle}.lt .nw{white-space:nowrap}.lt .tr{text-align:right;width:1%}.lt .tr button{padding:6px 11px}.lt tr.nd td{border-top:2px solid var(--b)}.lt tr.cu td{font-weight:700}#mch button{display:block;margin-top:5px;padding:5px 12px;font-size:13px}.lt .st{width:1%;font-size:16px;text-align:center;padding-right:8px}.lt .fd{padding:5px;border-color:var(--er)}.lt .ac{text-align:right;white-space:nowrap;width:1%}.lt .ac button{padding:6px 10px;margin-left:2px}.tech{margin:18px auto 0;padding-top:16px;border-top:1px solid var(--b);max-width:320px;line-height:1.55;font-size:14px}

</style></head><body><header id=apph><svg viewBox="0 0 100 100" width="36" height="36" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1d4ed8"/><path d="M30 52l14 14 28-32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><div><b>Control de Asistencia</b><span>30 Santo Domingo</span></div></header><div id=updb hidden><span></span><button onclick="doUpd()">Actualizar</button><button class=g aria-label="Cerrar aviso" onclick="this.parentNode.hidden=true">✕</button></div><div id="app"></div>
<nav><button onclick="go('hoy')" id="t-hoy">Hoy</button><button onclick="go('alu')" id="t-alu">Alumnos</button><button onclick="go('hor')" id="t-hor">Horario</button><button onclick="go('rep')" id="t-rep">Reportes</button><button onclick="go('aju')" id="t-aju">Ajustes</button></nav>

<script>
const DB=new Promise((r,j)=>{const q=indexedDB.open('asis',2);q.onupgradeneeded=()=>{const d=q.result;for(const s of['groups','students','classes','sessions','records','kv'])if(!d.objectStoreNames.contains(s))d.createObjectStore(s,{keyPath:s=='kv'?'k':'id'});const o=q.transaction.objectStore('records');for(const i of['sid','stid'])if(!o.indexNames.contains(i))o.createIndex(i,i)};q.onsuccess=()=>{const d=q.result;d.onversionchange=()=>{d.close();location.reload()};r(d)};q.onerror=()=>j(q.error);q.onblocked=()=>{const a=document.getElementById('app');if(a)a.innerHTML='<div class=card><b>La app está abierta en otra ventana.</b><p class=m>Cierra las otras ventanas de la app y vuelve a abrirla para terminar la actualización.</p></div>'}});
const tx=async(s,m,f)=>{const d=await DB;return new Promise((res,rej)=>{const t=d.transaction(s,m);const r=f(t.objectStore(s));t.oncomplete=()=>res(r&&r.result);t.onerror=()=>rej(t.error)})};
const by=(s,i,k)=>tx(s,'readonly',o=>o.index(i).getAll(k));
let BUSY=false;const once=f=>async(...a)=>{if(BUSY)return;BUSY=true;try{return await f(...a)}finally{BUSY=false}};
const all=async s=>{const r=await tx(s,'readonly',o=>o.getAll());return s=='groups'?r.sort((a,b)=>a.name.localeCompare(b.name,'es',{numeric:true})):r},get=(s,k)=>tx(s,'readonly',o=>o.get(k)),put=(s,v)=>tx(s,'readwrite',o=>o.put(v)),del=(s,k)=>tx(s,'readwrite',o=>o.delete(k));
const clr=s=>tx(s,'readwrite',o=>o.clear());
function toast(t){let e=$('#toast');if(!e){e=document.createElement('div');e.id='toast';e.style.cssText='position:fixed;left:12px;right:12px;bottom:84px;z-index:9;background:var(--t);color:var(--bg);padding:12px;border-radius:10px;text-align:center';document.body.appendChild(e)}e.textContent=t;e.hidden=false;clearTimeout(e.t);e.t=setTimeout(()=>e.hidden=true,Math.min(9000,Math.max(3500,t.length*75)))}
function ask(t,f){const d=document.createElement('div');d.style.cssText='position:fixed;inset:0;z-index:10;background:#0008;display:flex;align-items:center;justify-content:center;padding:20px';d.innerHTML=`<div class=card style="max-width:340px"><p>${esc(t)}</p><div class=row><button class=g id=no>Cancelar</button><button id=si style="background:var(--er)">Confirmar</button></div></div>`;document.body.appendChild(d);d.querySelector('#no').onclick=()=>d.remove();d.querySelector('#si').onclick=async()=>{d.remove();await f()}}
const $=s=>document.querySelector(s),app=$('#app'),pad=n=>String(n).padStart(2,'0');
const uid=()=>crypto.randomUUID?crypto.randomUUID():Date.now().toString(36)+Math.random().toString(36).slice(2)+Math.random().toString(36).slice(2);
const hm=d=>pad(d.getHours())+':'+pad(d.getMinutes()),ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const mins=t=>{const[a,b]=t.split(':');return+a*60+ +b},v=id=>document.getElementById(id).value;
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const ST={P:['✓ Asistencia','cP'],R:['⚠ Retardo','cR'],F:['✕ Falta','cF'],J:['ⓘ Permiso','cJ']};
const LEG='<p class=leg><span class="ch cP">Asistencia</span> <span class="ch cR">Retardo</span> <span class="ch cF">Falta</span> <span class="ch cJ">Permiso</span> <span class="ch cN">Pendiente</span></p>';
const DAYS=['Dom','Lun','Mar','Mié','Jue','Vie','Sáb'];
const VER='1.7';
let cfg={tol:10,ant:10,pend:'F',doc:'',snd:true},tab='hoy',S=null,stream=null,scanning=false,last='',lastT=0,imp=[],FD='';
const opts=(a,f)=>a.map(f).join('');
let SHW={alu:false,hor:false,grp:true};try{SHW={...SHW,...JSON.parse(localStorage.getItem('shw')||'{}')}}catch(e){}
function tgl(k){SHW[k]=!SHW[k];try{localStorage.setItem('shw',JSON.stringify(SHW))}catch(e){}const d=$('#ls-'+k),b=$('#bt-'+k);if(d)d.hidden=!SHW[k];if(b)b.textContent=SHW[k]?'Ocultar lista':'Mostrar lista'}
const tbtn=(k,n)=>n?`<button class=g id=bt-${k} style="padding:6px 12px;white-space:nowrap" onclick="tgl('${k}')">${SHW[k]?'Ocultar lista':'Mostrar lista'}</button>`:'';
function go(t){tab=t;S=null;FD='';stopCam();show()}
function salir(){ask('¿Salir de la app? Tus datos quedan guardados en este celular.',bye)}
function bye(){stopCam();S=null;tab='bye';const n=$('nav');if(n)n.style.display='none';const ub=$('#updb');if(ub)ub.hidden=true;app.innerHTML=`<div class=card style="text-align:center;margin-top:18vh"><h2>Saliste de la app</h2><p class=m>Tus datos quedaron guardados y la cámara está apagada. Ya puedes cerrar esta ventana o volver a la pantalla de inicio de tu celular.</p><button class=big onclick="back()">Volver a entrar</button></div>`;setTimeout(()=>{try{window.close()}catch(e){}},300)}
function back(){const n=$('nav');if(n)n.style.display='';go('hoy')}
async function show(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.id=='t-'+tab));app.innerHTML=await({hoy,alu,hor,rep,aju}[tab])()}
async function saveFile(n,data,pre){const lb=(pre?pre+'. ':'')+(n.startsWith('reporte')?'Reporte exportado: ':'Archivo generado: ')+n;try{if(window.claude&&claude.use){const d=await claude.use('downloads');if(d){await d.save({filename:n,data});toast(lb);return true}}}catch(e){if(e&&e.code=='declined'){toast('Descarga cancelada');return false}}
try{const a=document.createElement('a');a.href=URL.createObjectURL(data instanceof Blob?data:new Blob([data]));a.download=n;document.body.appendChild(a);a.click();a.remove();toast(lb+' (revisa tus descargas)');return true}catch(x){toast('No se pudo descargar: usa la vista previa o copia el texto');return false}}
function dl(n,t){const e=$('#exp');if(e)e.value=t;saveFile(n,n.endsWith('.csv')?'﻿'+t:t)}
/* HOY */
async function hoy(){const[cl,gs,ss,st]=await Promise.all([all('classes'),all('groups'),all('sessions'),all('students')]);
const now=new Date(),t=hm(now),today=ymd(now),g=id=>(gs.find(x=>x.id==id)||{}).name||'?';
const mine=cl.filter(c=>c.day==now.getDay()).sort((a,b)=>a.start.localeCompare(b.start));
const done=c=>ss.find(s=>s.date==today&&(s.cid==c.id||s.gid==c.gid&&s.subject==c.subject&&s.start==c.start));
const ant=cfg.ant>=0?+cfg.ant:10,cur=mine.find(c=>mins(t)<mins(c.end)&&mins(c.start)-mins(t)<=ant),nxt=mine.find(c=>c!=cur&&c.start>t);
const info=c=>`${esc(c.subject)}</h3><p>${esc(g(c.gid))} · ${c.start}–${c.end} · ${st.filter(x=>x.gid==c.gid).length} alumnos</p>`;
let h=`<div style="display:flex;justify-content:space-between;align-items:center;gap:8px"><h2>${DAYS[now.getDay()]} ${today} · ${t}</h2><button class=g style="padding:6px 12px;white-space:nowrap" onclick="salir()">Salir</button></div>`+(cfg.doc?`<p class=m>Docente: ${esc(cfg.doc)} <button class=g style="padding:3px 10px;font-size:13px" onclick="go('aju')">Cambiar</button></p>`:`<div class=card><b>Nombre del docente</b><p class=m>Aparecerá en los reportes. Puedes cambiarlo después en Ajustes.</p><div class=row><input id=dn placeholder="Nombre completo del docente" autocomplete=name><button onclick="saveDoc()">Guardar</button></div></div>`);
if(cur){const d=done(cur);h+=`<div class=card><small>CLASE ACTUAL</small><h3>${info(cur)}<button class=big ${d&&d.closed?'disabled':''} onclick="openC('${cur.id}')">${d?d.closed?'✓ ASISTENCIA REGISTRADA':'CONTINUAR ASISTENCIA':'TOMAR ASISTENCIA'}</button></div>`}else h+=`<div class="card m">No hay clase en este momento.</div>`;
if(nxt)h+=`<div class=card><small>PRÓXIMA CLASE</small><h3>${info(nxt)}</div>`;
h+=`<div class=card><b>Mis clases de hoy</b>`+(mine.length?`<div class=tbl><table class=lt id=mch><tr><th></th><th>Horario</th><th>Materia</th><th>Grupo</th></tr>${opts(mine,c=>{const d=done(c);return`<tr${c==cur?' class=cu':''}><td class=st>${d?d.closed?'<span class=ok title="Registrada">✓</span>':'<span class=wa title="En curso">●</span>':'<span class=m title="Pendiente">○</span>'}</td><td class=nw>${c.start}–${c.end}${d&&d.closed?`<button class=g onclick="fixS('${d.id}')">Corregir</button>`:`<button class=g onclick="openC('${c.id}')">${d?'Continuar':'Tomar'}</button>`}</td><td>${esc(c.subject)}</td><td class=nw>${esc(g(c.gid))}</td></tr>`})}</table></div><p class=m style="margin:10px 0 0;font-size:13px"><span class=ok>✓</span> Registrada · <span class=wa>●</span> En curso · ○ Pendiente</p><p class=m style="margin:4px 0 0;font-size:13px">Tomar abre la lista de esa clase aunque no sea su hora. Corregir cambia el estado de un alumno en una clase ya cerrada.</p>`:'<p class=m>Sin clases. Agrégalas en Horario.</p>')+`</div>`;
const curS=cur&&done(cur),op=ss.filter(x=>!x.closed&&x!=curS).sort((a,b)=>(b.date+b.start).localeCompare(a.date+a.start)),badc=cl.filter(c=>!okd(c)).length;
if(op.length)h+=`<div class=card id=opn><b>Clases sin cerrar (${op.length})</b><p class=m style="margin:4px 0 0;font-size:13px">No cuentan en los reportes hasta que las finalices.</p><div class=tbl><table class=lt>${opts(op,x=>`<tr><td><b>${esc(x.subject)}</b> · ${esc(x.gname||g(x.gid))}<br><small>${x.date} · ${x.start}–${x.end}</small></td><td class=ac><button onclick="openS('${x.id}')">Continuar</button><button class=g onclick="delSes('${x.id}')">✕</button></td></tr>`)}</table></div></div>`;
if(badc)h+=`<div class=card><p class=er style="margin:0 0 8px">${badc} ${badc==1?'clase de tu horario quedó':'clases de tu horario quedaron'} sin día y no aparecen aquí.</p><button class=g onclick="go('hor')">Corregir en Horario</button></div>`;
if(ss.some(x=>x.closed))h+=`<div class=card id=fxc><b>Corregir una clase cerrada</b><p class=m style="margin:4px 0 6px;font-size:13px">Las de hoy se corrigen con el botón Corregir de «Mis clases de hoy». Para otro día o una clase extraordinaria, elige la fecha:</p><input type=date id=fd value="${FD}" max="${today}" aria-label="Fecha de la clase" onchange="fixL()"><div id=fl>${FD?fixH(ss,gs,FD):''}</div></div>`;
h+=`<div class=card><b>Clase extraordinaria / sustitución</b><div class=row><select id=xg>${opts(gs,x=>`<option value=${x.id}>${esc(x.name)}</option>`)}</select><input id=xs placeholder="Materia"></div><button class=g onclick="openX()">Iniciar ahora (50 min)</button></div>`;return h}
async function openC(cid){const c=await get('classes',cid),today=ymd(new Date()),gs=await all('groups');
let s=(await all('sessions')).find(x=>x.date==today&&(x.cid==cid||x.gid==c.gid&&x.subject==c.subject&&x.start==c.start));
if(!s){s={id:uid(),cid,gid:c.gid,gname:(gs.find(x=>x.id==c.gid)||{}).name||'?',subject:c.subject,date:today,start:c.start,end:c.end,closed:false,teacher:cfg.doc||''};await put('sessions',s)}
S=s;att()}
async function openX(){if(!$('#xg')||!v('xg')||!v('xs').trim())return toast('Elige grupo y escribe la materia');const gs=await all('groups'),n=new Date(),e=new Date(n.getTime()+3e6);
S={id:uid(),cid:null,gid:v('xg'),gname:gs.find(x=>x.id==v('xg')).name,subject:v('xs').trim(),date:ymd(n),start:hm(n),end:hm(e),closed:false,teacher:cfg.doc||''};await put('sessions',S);att()}
async function openS(id){const x=await get('sessions',id);if(!x||x.closed)return show();S=x;att()}
const delSes=id=>ask('¿Eliminar esta clase sin cerrar y sus registros?',async()=>{for(const r of await by('records','sid',id))await del('records',r.id);await del('sessions',id);show()});
/* CORREGIR CLASE CERRADA */
const fixH=(ss,gs,d)=>{const L=ss.filter(x=>x.closed&&x.date==d).sort((a,b)=>a.start.localeCompare(b.start));return L.length?`<div class=tbl><table class=lt>${opts(L,x=>`<tr><td><b>${esc(x.subject)}</b> · ${esc(x.gname||(gs.find(g=>g.id==x.gid)||{}).name||'?')}<br><small>${x.start}–${x.end}</small></td><td class=ac><button class=g onclick="fixS('${x.id}')">Corregir</button></td></tr>`)}</table></div>`:'<p class=m style="margin:8px 0 0">No hay clases cerradas ese día.</p>'};
async function fixL(){FD=v('fd');const e=$('#fl');if(e)e.innerHTML=FD?fixH(await all('sessions'),await all('groups'),FD):''}
const fsum=()=>{const c={P:0,R:0,F:0,J:0};let p=0;S.st.forEach(s=>{const r=S.map[s.id];r?c[r.status]++:p++});return`<span class="ch cP">${c.P} asistencias</span> <span class="ch cR">${c.R} retardos</span> <span class="ch cF">${c.F} faltas</span> <span class="ch cJ">${c.J} permisos</span> <span class="ch cN">${p} pendientes</span>`};
async function fixS(id){const x=await get('sessions',id);if(!x||!x.closed)return show();stopCam();S=x;S.st=(await all('students')).filter(s=>s.gid==S.gid).sort((a,b)=>a.name.localeCompare(b.name));S.map={};(await by('records','sid',S.id)).forEach(r=>S.map[r.stid]=r);
app.innerHTML=`<div class=card id=fix><small>CORREGIR CLASE CERRADA</small><h3>${esc(S.subject)} · ${esc(S.gname||'')}</h3><small>${S.date} · ${S.start}–${S.end}</small><p class=m>Toca A, R, F o P para cambiar el estado de un alumno. Cada cambio se guarda al momento y la clase sigue cerrada.</p><p class=leg id=fxs>${fsum()}</p>${S.st.length?'':'<p class=er>Este grupo no tiene alumnos.</p>'}<div id=lista></div><button class=big onclick="fixEnd()">LISTO</button></div>`;if(S.st.length)lst(1);scrollTo(0,0)}
async function fixSet(id,k){const s=S.st.find(x=>x.id==id),ex=S.map[id];if(!s||ex&&ex.status==k)return;const n=new Date(),r={id:S.id+'|'+id,sid:S.id,stid:id,status:k,time:ex?ex.time:S.date==ymd(n)?hm(n):'—'};await put('records',r);S.map[id]=r;const f=$('#fxs');if(f)f.innerHTML=fsum();lst(1);toast(s.name+': '+(ex?ST[ex.status][0].slice(2):'Pendiente')+' → '+ST[k][0].slice(2))}
function fixEnd(){S=null;show()}
/* ASISTENCIA */
const idle=()=>noCam?'Cámara no disponible: usa matrícula o lista':scanning?'Apunta la cámara al QR de la credencial':'Cámara apagada. Actívala para escanear, o usa la matrícula o la lista.';

function csvRows(t){t=t.replace(/^﻿/,'');const f=t.split(/\r?\n/)[0]||'',n=c=>f.split(c).length-1,d=n(';')>n(',')&&n(';')>=n('\t')?';':n('\t')>n(',')?'\t':',';

paint(XT.d,XT.al,XT.bd,true,H,1).toBlob(b=>{if(!b)return toast('No se pudo crear la imagen: usa PDF');const u=URL.createObjectURL(b);saveFile('reporte.'+(j?'jpg':'png'),b);$('#prev').innerHTML=`<p class=m>Si no se descargó, mantén presionada la imagen para guardarla.</p><img src="${u}" style="width:100%;background:#fff">`},j?'image/jpeg':'image/png',.92)}
function exp_pdf(){if(!XT)return toast('Genera el reporte primero');const ps=pages(),enc=new TextEncoder(),parts=[],off=[],N=ps.length;let len=0;
const add=x=>{const b=typeof x=='string'?enc.encode(x):x;parts.push(b);len+=b.length},obj=(n,x)=>{off[n]=len;add(n+' 0 obj\n'+x+'\nendobj\n')};
add('%PDF-1.4\n');obj(1,'<</Type/Catalog/Pages 2 0 R>>');obj(2,'<</Type/Pages/Count '+N+'/Kids['+ps.map((_,i)=>(3+3*i)+' 0 R').join(' ')+']>>');
ps.forEach((cs,i)=>{const by=Uint8Array.from(atob(cs.toDataURL('image/jpeg',.92).split(',')[1]),ch=>ch.charCodeAt(0)),p=3+3*i,st='q 595 0 0 842 0 0 cm /Im0 Do Q';
obj(p,'<</Type/Page/Parent 2 0 R/MediaBox[0 0 595 842]/Resources<</XObject<</Im0 '+(p+2)+' 0 R>>>>/Contents '+(p+1)+' 0 R>>');obj(p+1,'<</Length '+st.length+'>>\nstream\n'+st+'\nendstream');
off[p+2]=len;add((p+2)+' 0 obj\n<</Type/XObject/Subtype/Image/Width '+cs.width+'/Height '+cs.height+'/ColorSpace/DeviceRGB/BitsPerComponent 8/Filter/DCTDecode/Length '+by.length+'>>\nstream\n');add(by);add('\nendstream\nendobj\n')});
const xr=len,tot=3*N+3;add('xref\n0 '+tot+'\n0000000000 65535 f \n');for(let k=1;k<tot;k++)add(String(off[k]).padStart(10,'0')+' 00000 n \n');add('trailer\n<</Size '+tot+'/Root 1 0 R>>\nstartxref\n'+xr+'\n%%EOF');
const bl=new Blob(parts,{type:'application/pdf'}),u=URL.createObjectURL(bl);saveFile('reporte.pdf',bl);$('#prev').innerHTML=`<p>Si no se descargó: <a href="${u}" target="_blank">abrir el PDF</a></p>`}
async function hist(id){const s=await get('students',id),ss=Object.fromEntries((await all('sessions')).map(x=>[x.id,x])),rc=(await by('records','stid',id)).filter(r=>ss[r.sid]).sort((a,b)=>(ss[b.sid].date+b.time).localeCompare(ss[a.sid].date+a.time));
const n=Object.values(ss).filter(x=>x.gid==s.gid&&x.closed).length,k={P:0,R:0,F:0,J:0};rc.filter(r=>ss[r.sid].closed).forEach(r=>k[r.status]++);
$('#hist').innerHTML=`<h3>${esc(s.name)} · ${esc(s.mat)}</h3><p><b>${k.P} asistencias, ${k.J} permisos, ${k.R} retardos, ${k.F} faltas</b> de ${n} clases con lista</p><table>${opts(rc,r=>`<tr><td>${ss[r.sid].date}</td><td>${esc(ss[r.sid].subject)}</td><td>${r.time}</td><td><span class="ch ${ST[r.status][1]}">${ST[r.status][0]}</span></td></tr>`)}</table>`}
const wipe=k=>ask(k?'Se borrarán todas las sesiones y registros de asistencia (los alumnos se conservan).':'Se borrarán TODOS los datos de la app.',async()=>{for(const x of k?['sessions','records']:['groups','students','classes','sessions','records'])await clr(x);toast('Datos borrados');show()});
function man(){app.innerHTML=`<div class=np><button onclick="window.print()">Imprimir / PDF</button> <button class=g onclick="go('aju')">Volver</button></div><div class="card man"><h2>Manual de uso</h2>
<p class=m>Versión ${VER}. Guía para usar la app paso a paso.</p>
<h3>1. Qué hace la app</h3><ul><li>En la parte superior de todas las pestañas aparece el título «Control de Asistencia · 30 Santo Domingo».</li><li>Registra la asistencia de tus grupos escaneando el código QR de la credencial de cada alumno, escribiendo su matrícula o marcándolo en la lista.</li><li>Todos los datos se guardan <b>solo en este celular y en este navegador</b>. No hay servidor ni cuenta: nadie más los ve, pero tampoco se respaldan solos.</li><li>Una vez instalada, funciona sin internet.</li><li><b>Menú inferior</b>: cinco pestañas siempre visibles: Hoy, Alumnos, Horario, Reportes y Ajustes. La pestaña en la que estás se ve en azul. Cada una se explica en su sección de este manual.</li><li><b>Ventanas de confirmación</b>: las acciones que borran datos o cierran la app preguntan antes. Cancelar no hace nada; Confirmar ejecuta la acción.</li><li><b>Avisos</b>: los mensajes breves que aparecen abajo (por ejemplo «Guardado») desaparecen solos en unos segundos.</li></ul>
<h3>2. Primeros pasos (una sola vez)</h3><ol><li><b>Nombre del docente</b>: escríbelo en la tarjeta que aparece en Hoy y pulsa Guardar. Saldrá en todos los reportes.</li><li><b>Alumnos</b>: importa tu lista en CSV (crea los grupos automáticamente) o crea los grupos y agrega alumnos a mano.</li><li><b>Credenciales</b>: en Alumnos, pulsa Credenciales en cada grupo, imprime o guarda en PDF y entrega una a cada alumno.</li><li><b>Horario</b>: importa tu horario en CSV o captura cada clase a mano.</li><li><b>Ajustes</b>: revisa la tolerancia de retardo y la anticipación para tomar asistencia, ambas en minutos.</li><li><b>Respaldo</b>: al terminar, en Ajustes pulsa Exportar respaldo y guarda el archivo.</li></ol>
<h3>3. Colores de los estados</h3>${LEG}<ul><li>Verde = asistencia, amarillo = retardo, rojo = falta, naranja = permiso, blanco = pendiente (alumno sin registro).</li><li>Son los mismos en la lista, la confirmación del escaneo, el historial y los reportes (pantalla, PDF, PNG y JPG).</li></ul>
<h3>4. Pestaña Hoy</h3><ul><li><b>Docente</b>: muestra tu nombre; el botón Cambiar te lleva a Ajustes para modificarlo.</li><li><b>Salir</b>: cierra la app (ver sección 9).</li><li><b>Clase actual</b>: se detecta sola según tu horario, el día y la hora. Aparece desde los minutos de anticipación que elijas en Ajustes (10 de fábrica) antes de que empiece y hasta que termina. Si registras antes de la hora de inicio cuenta como asistencia. Botón TOMAR ASISTENCIA (o CONTINUAR ASISTENCIA si la dejaste abierta). Cuando ya la cerraste, dice ✓ ASISTENCIA REGISTRADA.</li><li><b>Próxima clase</b>: la siguiente clase del día. Es solo informativa; se convierte en clase actual al llegar su anticipación.</li><li><b>Mis clases de hoy</b>: tabla con el horario, la materia y el grupo de cada clase. El símbolo de la izquierda indica su estado: ✓ Registrada (ya cerrada), ● En curso (abierta, sin cerrar) u ○ Pendiente. La clase actual aparece en negritas. La pantalla se actualiza sola cada medio minuto.</li><li><b>Botones Tomar y Continuar</b> (en Mis clases de hoy): cada clase que no está cerrada tiene su botón debajo de su horario. <b>Tomar</b> abre la asistencia de esa clase aunque todavía no sea su hora o ya haya pasado; <b>Continuar</b> vuelve a abrir una que dejaste sin finalizar. Las clases ya registradas muestran <b>Corregir</b> (ver «Corregir una clase cerrada» en la sección 5). Si la hora de la clase ya pasó, el escaneo y la matrícula registran Retardo porque la tolerancia ya terminó: en ese caso marca a cada alumno con los botones A, R, F y P de Ver lista. Si abriste una clase por error, elimínala con ✕ en «Clases sin cerrar».</li><li><b>Clases sin cerrar</b>: si saliste de una clase sin finalizarla, aparece aquí, incluso días después. Continuar la abre para terminar de pasar lista y finalizarla; ✕ la elimina con sus registros. Mientras no la finalices, no cuenta en los reportes.</li><li><b>Corregir en Horario</b>: este aviso solo aparece si alguna clase de tu horario quedó guardada sin día; el botón te lleva a la pestaña Horario para elegirle el día.</li><li><b>Corregir una clase cerrada</b> (tarjeta en Hoy): aparece cuando ya tienes clases cerradas. Sirve para las clases de otro día y para las extraordinarias: elige la fecha y pulsa Corregir en la clase. Las de hoy se corrigen más rápido con el botón Corregir de «Mis clases de hoy».</li><li><b>Clase extraordinaria / sustitución</b>: para una clase fuera de horario. Elige el grupo, escribe la materia y pulsa Iniciar ahora; dura 50 minutos y la tolerancia cuenta desde ese momento.</li></ul>
<h3>5. Tomar asistencia</h3><ul><li><b>Cámara</b>: al abrir la clase la cámara está <b>apagada</b>. Si quieres escanear, pulsa ACTIVAR CÁMARA y acepta el permiso; APAGAR CÁMARA la detiene. Puedes pasar lista sin cámara, con la matrícula o la lista.</li><li><b>Escanear</b>: con la cámara activa, acerca el QR de la credencial. Registra y sigue escaneando sin detenerse; la pantalla no se apaga mientras escaneas. Si el sonido está activado en Ajustes, un pitido agudo confirma cada registro y uno grave avisa de un error.</li><li><b>Tolerancia</b>: arriba de la cámara se indica hasta qué hora cuenta como asistencia. Dentro de la tolerancia registra <b>Asistencia</b>; después registra <b>Retardo</b>.</li><li><b>Avisos del escaneo</b>: «Asistencia ya registrada» (muestra la hora del primer registro y no duplica), «El alumno no pertenece a este grupo» y «QR no encontrado» (la credencial no es de esta app o se generó en otro celular; ver sección 11).</li><li><b>Contador</b> 28 / 35: alumnos con registro del total del grupo.</li><li><b>En línea / Sin conexión</b>: el indicador de arriba solo informa si el celular tiene internet. La asistencia se guarda igual en los dos casos.</li><li><b>Introducir matrícula</b>: escribe la matrícula y pulsa Enter o el botón. Aplica la misma regla de tolerancia.</li><li><b>Ver lista</b>: muestra a todos con su estado. Los botones A (asistencia), R (retardo), F (falta) y P (permiso) registran o corrigen a mano; el estado actual queda resaltado. Quien no tiene registro aparece como Pendiente.</li><li><b>Finalizar</b>: muestra el resumen y pregunta qué hacer con los pendientes: MARCAR COMO FALTA o DEJAR PENDIENTES. Si no quedó ningún pendiente, aparece solo el botón CERRAR SESIÓN. Después de cerrar ya no se escanea ni se captura matrícula en esa clase, pero el estado de cualquier alumno se puede cambiar con Corregir.</li><li><b>Corregir una clase cerrada</b>: por si un alumno llegó después del pase de lista o hay que cambiar una falta por permiso. En Hoy pulsa Corregir en la clase; se abre la lista con el resumen de la clase. Toca A, R, F o P en el alumno: el cambio se guarda al momento, un aviso indica el cambio (por ejemplo «Falta → Retardo») y la clase sigue cerrada, así que no hay que finalizarla otra vez. LISTO regresa a Hoy. La hora del registro original se conserva. Los reportes muestran el cambio la siguiente vez que pulses Generar.</li><li><b>Salir</b>: regresa a Hoy sin cerrar; puedes continuar después con CONTINUAR ASISTENCIA.</li><li>Si la cámara no está disponible, usa la matrícula o la lista.</li></ul>
<h3>6. Pestaña Alumnos</h3><ul><li><b>Grupos</b>: escribe el nombre (ej. 3A) y pulsa Agregar grupo. La tabla muestra cada grupo con su número de alumnos, el botón Credenciales y ✕ para eliminarlo (borra también sus alumnos, sus clases del horario y sus asistencias; pide confirmación). El botón Mostrar lista / Ocultar lista despliega o esconde la tabla.</li><li><b>Credenciales</b>: muestra la credencial de cada alumno con su nombre, matrícula, grupo y QR. Imprimir / PDF las manda a la impresora o las guarda como PDF; Volver regresa a Alumnos. El QR no contiene datos personales, solo un código.</li><li><b>Nuevo alumno</b>: matrícula (única), nombre completo y grupo; pulsa Guardar alumno.</li><li><b>Importar CSV</b>: columnas Matrícula, Nombre, Grupo. Un solo archivo puede traer a todos los grupos: cada alumno va al grupo de su fila y los grupos que no existan se crean solos («3A» y «3°A» cuentan como el mismo). Al elegir el archivo aparece la vista previa con cuántos alumnos van a cada grupo y los errores por línea (matrícula duplicada, campos faltantes). Nada se guarda hasta pulsar Confirmar importación. También puedes pegar el texto en el cuadro y pulsar Vista previa.</li><li><b>Formato del CSV</b>: en Excel usa Guardar como → CSV. Acepta coma, punto y coma o tabulador, con o sin encabezados; con encabezados las columnas pueden ir en cualquier orden. La app no lee archivos .xlsx.</li><li><b>Compartir alumnos con QR</b>: ver sección 11.</li><li><b>Lista de alumnos</b>: al final de la pestaña. El botón Mostrar lista / Ocultar lista la despliega o la esconde; el encabezado indica siempre cuántos alumnos hay. Está ordenada por grupo y nombre; ✕ elimina a un alumno y sus asistencias.</li></ul>
<h3>7. Pestaña Horario</h3><ul><li><b>Agregar clase</b>: grupo, materia, día (de lunes a domingo), inicio y término; pulsa Agregar. Las horas pueden escribirse como 07:00, 7:00 o 1:30 pm. Si algo está mal, el aviso dice cuál campo y qué hora leyó.</li><li><b>Importar horario CSV</b>: columnas Grupo, Materia, Día, Inicio, Término, una fila por clase. El día puede ser Lunes, Lun, L o un número (1 = lunes … 6 = sábado, 7 = domingo); para miércoles usa Mié, Miércoles o X. Los grupos que no existan se crean solos. La vista previa muestra las clases por día, avisa si dos clases se empalman y marca los errores por línea. Nada se guarda hasta Confirmar importación, y volver a importar el mismo archivo no duplica clases. También puedes pegar el texto en el cuadro y pulsar Vista previa.</li><li><b>Lista de clases</b>: al final de la pestaña. El botón Mostrar lista / Ocultar lista la despliega o la esconde; el encabezado indica cuántas clases hay. Es una tabla con día, horario, materia y grupo, ordenada de lunes a domingo y por hora; ✕ elimina una clase.</li><li><b>Borrar todo el horario</b>: quita todas las clases para cargar un horario nuevo (por ejemplo, cada semestre). Las asistencias ya registradas se conservan.</li></ul>
<h3>8. Pestaña Reportes</h3><ul><li>Elige el grupo, el rango de fechas y, si quieres, la materia. Luego elige el tipo de reporte y pulsa Generar.</li><li>Los reportes cuentan <b>solo clases cerradas</b> (finalizadas). La excepción es «Asistencia del día», que también muestra clases abiertas.</li><li><b>Encabezado</b>: docente, grupo, periodo o día, materia y fecha de generación.</li><li><b>Totales</b>: tarjetas con el número de clases, alumnos, asistencias, retardos, permisos, faltas y pendientes.</li><li><b>Resumen general</b>: por alumno, cuántas asistencias, retardos, permisos y faltas tuvo y el total de clases, con una fila TOTAL. En rojo, los alumnos con 3 o más faltas. Toca a un alumno para ver su historial (por ejemplo: 5 asistencias, 2 permisos, 1 retardo, 2 faltas) y cada registro con su fecha y materia.</li><li><b>Solo asistencias / retardos / faltas / permisos / pendientes</b>: lista cada registro de ese estado con fecha, materia, matrícula, alumno y hora.</li><li><b>Asistencia del día (por materia)</b>: elige el día en el campo «Día». Muestra a cada alumno con su estado en cada clase de ese día.</li><li><b>Exportar</b>: CSV, PDF, PNG y JPG exportan lo que ves en pantalla. El PDF sale en hojas tamaño A4; PNG y JPG son una sola imagen. El CSV no lleva colores; también aparece en el cuadro de texto para copiarlo.</li><li><b>Avisos</b>: al pulsar Generar aparece «Reporte generado» y la pantalla baja hasta el reporte. Al exportar, el aviso «Reporte exportado» indica el nombre del archivo creado.</li><li>Si el navegador no descarga el archivo, mantén presionada la imagen que aparece para guardarla, o usa el enlace para abrir el PDF.</li></ul>
<h3>9. Pestaña Ajustes</h3><ul><li><b>Nombre del docente</b>: escribe el nombre y pulsa Guardar. Para cambiarlo, corrige el campo y vuelve a guardar; el nombre nuevo se aplica también a las clases anteriores.</li><li><b>Tolerancia de retardo (minutos)</b>: tiempo desde el inicio de la clase en que el escaneo o la matrícula aún cuentan como asistencia. Con 0, todo registro posterior a la hora de inicio es retardo.</li><li><b>Anticipación para tomar asistencia (minutos)</b>: cuántos minutos antes de la hora de inicio aparece la clase como «Clase actual» en Hoy, con su botón TOMAR ASISTENCIA. De fábrica son 10; acepta de 0 a 240. Con 0, la clase aparece justo a su hora de inicio. Si tienes clases seguidas, la siguiente aparece cuando termina la anterior. No cambia la regla de retardo.</li><li><b>Guardar</b>: guarda el nombre, la tolerancia, la anticipación, los pendientes y el sonido. Los cambios no se aplican hasta pulsarlo.</li><li><b>Pendientes al finalizar</b>: opción sugerida al cerrar una clase (marcar falta o dejar pendientes).</li><li><b>Sonido al registrar (pitido)</b>: activa o desactiva el sonido que confirma cada registro. Al guardar con el sonido activado se escucha un pitido de prueba.</li><li><b>Tema: claro/oscuro/auto</b>: cada toque cambia entre claro, oscuro y automático (el del celular). Se aplica al momento, sin pulsar Guardar.</li><li><b>Respaldo</b>: Exportar respaldo guarda un archivo con grupos, alumnos y sus QR, horario, asistencias y configuración. Para restaurar, elige ese archivo; los datos se agregan o actualizan, no se borra lo que ya había. El contenido del respaldo aparece también en el cuadro de texto, por si el navegador no descarga el archivo.</li><li><b>Ayuda</b>: Ver manual de uso abre este manual (Imprimir / PDF lo imprime o lo guarda; Volver regresa a Ajustes). También muestra la versión instalada y el botón Buscar actualización (ver sección 10).</li><li><b>Borrar datos</b>: «Borrar registros de asistencia» elimina clases tomadas y registros, y conserva alumnos y horario. «Borrar todo» elimina también grupos, alumnos y horario. Ambos son permanentes: exporta un respaldo antes.</li><li><b>Acerca de</b>: al final de Ajustes, quién creó la app, la versión instalada y la tecnología con la que está hecha.</li><li><b>Salir de la app</b>: pide confirmación, apaga la cámara y muestra la pantalla de salida. Si el navegador lo permite, la ventana se cierra sola; si no, ciérrala tú o vuelve a la pantalla de inicio del celular. Tus datos quedan guardados. En la pantalla de salida, Volver a entrar abre la app de nuevo. También está el botón Salir en Hoy.</li></ul>
<h3>10. Instalar y actualizar</h3><ul><li><b>Instalar</b>: abre el enlace de la app con internet y espera a que cargue. En Android (Chrome): menú ⋮ → Instalar aplicación o Añadir a pantalla de inicio. En iPhone (Safari): Compartir → Añadir a pantalla de inicio.</li><li><b>Apertura rápida</b>: después de esa primera carga, la app instalada abre de inmediato con la copia guardada en el celular, con o sin internet.</li><li><b>Publicar una versión nueva</b> (quien administra el sitio): reemplaza en el repositorio todos los archivos del paquete, incluido version.json, y espera unos minutos a que se publiquen.</li><li><b>Aviso de versión nueva</b>: al abrir con internet, la app busca en segundo plano si hay una versión nueva. Si la hay, aparece arriba el aviso «Nueva versión disponible» con el botón Actualizar; ✕ cierra el aviso sin actualizar. Si no lo tocas, la versión nueva se aplica sola la siguiente vez que abras la app.</li><li><b>Actualizar a mano</b>: en Ajustes pulsa Buscar actualización, con internet. La app compara tu versión con la publicada: si hay una nueva, la descarga, se reinicia y avisa «App actualizada a la versión…»; si no, avisa que ya tienes la más reciente. Tus datos no se borran.</li><li><b>Versión</b>: en Ajustes, «Versión de la app» indica cuál tienes. La numeración empieza en 1.0 y sube con cada actualización (1.1, 1.2…).</li></ul>
<h3>11. Usar la app en otro celular (otro docente)</h3><ol><li>Compártele el enlace de la app. Lo abre con internet y la instala como en la sección 10.</li><li>Escribe su nombre en la tarjeta «Nombre del docente» de Hoy.</li><li>Para que las credenciales que ya imprimiste le funcionen: tú vas a Alumnos → Compartir alumnos con QR, eliges todos los grupos o uno solo, pulsas «Exportar alumnos con QR» y le envías el archivo. Ese archivo lleva solo grupos, alumnos y su QR; no incluye asistencias, horario ni tu nombre.</li><li>Él abre el archivo en Alumnos → «Recibir de otro docente», revisa la vista previa y pulsa Confirmar importación. Si un alumno ya existía en su celular, solo se cambia su QR y se conservan sus asistencias.</li><li>Carga su propio horario.</li></ol><ul><li>Si en lugar de eso importa la lista en CSV, su celular genera códigos distintos y tendría que imprimir credenciales nuevas.</li><li>Cada celular guarda sus asistencias por separado; no se sincronizan entre sí.</li><li>El archivo contiene datos de tus alumnos: envíalo solo a ese docente.</li></ul>
<h3>12. Cuidado de tus datos</h3><ul><li>Exporta un respaldo cada semana y guárdalo fuera del celular (correo o nube).</li><li>No borres los datos de navegación del sitio ni desinstales la app sin respaldo: se perderían los registros.</li><li>Usa siempre el mismo navegador y el mismo enlace. Otro navegador u otro enlace muestran la app vacía.</li><li>Si cambias de celular: exporta el respaldo en el anterior y restáuralo en el nuevo.</li></ul>
<h3>13. Solución de problemas</h3><ul><li><b>No aparece la clase actual</b>: revisa en Horario que la clase esté en el día correcto y que la hora actual esté entre la anticipación configurada en Ajustes (10 minutos de fábrica) antes del inicio y el término. Revisa también la hora del celular. Mientras tanto, puedes abrirla con el botón Tomar en «Mis clases de hoy».</li><li><b>Se me pasó la hora y no tomé asistencia</b>: en Hoy, en «Mis clases de hoy», pulsa Tomar en esa clase y marca a los alumnos en Ver lista. Solo aplica a las clases del día de hoy.</li><li><b>Quiero pasar lista antes de la hora</b>: sube la anticipación en Ajustes o pulsa Tomar en esa clase.</li><li><b>Me registra retardo</b>: la hora ya pasó de la tolerancia. Cámbialo a mano en Ver lista o ajusta la tolerancia en Ajustes.</li><li><b>«QR no encontrado»</b>: la credencial se generó en otro celular. Pide al otro docente el archivo de alumnos con QR (sección 11) o imprime credenciales nuevas.</li><li><b>La cámara no abre</b>: pulsa ACTIVAR CÁMARA y permite el uso de la cámara en el navegador. Si abriste la app como archivo suelto, usa la versión instalada o registra por matrícula o lista.</li><li><b>El CSV marca errores</b>: la vista previa dice la línea y el motivo. Corrige el archivo y vuelve a elegirlo.</li><li><b>La hora de término «debe ser posterior»</b>: el aviso muestra las horas que leyó; revisa AM/PM o escribe en formato de 24 horas (13:00).</li><li><b>La app tarda en abrir</b>: desde la versión 1.5 abre con la copia guardada sin esperar a internet. Si aún tarda, es el arranque del propio celular. No hace falta «limpiar caché»: la caché es lo que permite abrir rápido y sin internet, y tus datos no son parte de ella.</li><li><b>No veo los cambios nuevos</b>: revisa la versión en Ajustes y pulsa Buscar actualización con internet. Si dice que ya tienes la más reciente, los archivos nuevos aún no están publicados: revisa que se hayan subido todos, incluido version.json, y espera unos minutos.</li><li><b>No se escucha el pitido</b>: revisa que el sonido esté activado en Ajustes y que el celular no esté en silencio.</li><li><b>El botón Salir no cierra la ventana</b>: algunos navegadores no permiten que una página se cierre sola. La app ya quedó cerrada y con la cámara apagada; cierra la ventana a mano.</li><li><b>Una clase del horario aparece sin día</b>: la versión 1.0 a 1.3 guardaba sin día las clases agregadas a mano. En Horario, la lista muestra un selector rojo en esas clases: elige el día y queda corregida.</li><li><b>Salí de una clase sin finalizarla</b>: búscala en Hoy, en «Clases sin cerrar», y pulsa Continuar.</li><li><b>Un alumno llegó después de que cerré la clase</b>: en Hoy pulsa Corregir en esa clase y cámbialo de Falta a Retardo o Asistencia (sección 5).</li><li><b>Cerré una clase por error</b>: no se puede reabrir para escanear, pero con Corregir puedes marcar a cada alumno a mano. Si prefieres escanear, inicia una clase extraordinaria del mismo grupo.</li></ul>

async function aju(){return`<div class=card><b>Configuración</b><div class=row><label style="flex:1 1 100%">Nombre del docente (aparece en los reportes)<input id=cd value="${esc(cfg.doc||'')}" placeholder="Nombre completo" autocomplete=name style="width:100%"></label></div><div class=row><label>Tolerancia de retardo (minutos)<input type=number id=ct min=0 step=1 inputmode=numeric value=${cfg.tol}></label><label style="flex:1 1 100%">Anticipación para tomar asistencia (minutos)<br><input type=number id=ca min=0 step=1 inputmode=numeric value=${cfg.ant>=0?cfg.ant:10}></label><label>Pendientes al finalizar<select id=cp><option value=F ${cfg.pend=='F'?'selected':''}>Marcar falta</option><option value=N ${cfg.pend=='N'?'selected':''}>Dejar pendientes</option></select></label><label>Sonido al registrar (pitido)<select id=cs><option value=1 ${cfg.snd?'selected':''}>Activado</option><option value=0 ${cfg.snd?'':'selected'}>Desactivado</option></select></label></div><button onclick="saveC()">Guardar</button> <button class=g onclick="theme()">Tema: claro/oscuro/auto</button></div>
<div class=card><b>Respaldo</b><p class=m>Los datos viven solo en este dispositivo. Haz respaldos periódicos.</p><button onclick="bk()">Exportar respaldo</button> <input type=file accept=.json onchange="rs(this)"><textarea id=exp rows=3 style="width:100%;margin-top:8px" readonly></textarea></div><div class=card><b>Ayuda</b><p class=m>Manual paso a paso (funciona sin internet).</p><button onclick="man()">Ver manual de uso</button><p class=m>Versión de la app: <b id=ver>${VER}</b></p><button class=g onclick="upd()">Buscar actualización</button></div><div class=card><b>Salir</b><p class=m>Apaga la cámara y cierra la app. Tus datos quedan guardados.</p><button class=g onclick="salir()">Salir de la app</button></div><div class=card><b>Borrar datos</b><p class=m>Acciones permanentes. Exporta un respaldo antes.</p><button class=g onclick="wipe(1)">Borrar registros de asistencia</button> <button style="background:var(--er)" onclick="wipe(0)">Borrar todo</button></div><div class=card id=about style="text-align:center;padding:22px 14px"><svg viewBox="0 0 100 100" width="52" height="52" aria-hidden="true"><rect width="100" height="100" rx="22" fill="#1d4ed8"/><path d="M30 52l14 14 28-32" fill="none" stroke="#fff" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/></svg><h3 style="margin:8px 0 0;font-size:19px">Control de Asistencia</h3><p class=m style="margin:2px 0 16px">30 Santo Domingo · versión ${VER}</p><p class=m style="margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Creada por</p><p style="margin:4px 0 4px;font-size:19px;font-weight:700">Christian Reyes Guzmán</p><p class=m style="margin:0;line-height:1.5">Docente del Plantel 30 Santo Domingo<br>Colegio de Bachilleres de Chiapas</p><p class=m style="margin:16px auto 0;max-width:300px;font-style:italic;line-height:1.45">Hecha por un docente para docentes: pasa lista en uno o dos minutos, con o sin internet.</p><div class="m tech" id=tech><p style="margin:0 0 4px;font-size:12px;letter-spacing:.12em;text-transform:uppercase">Tecnología</p>Aplicación web progresiva (PWA)<br>Lenguajes: HTML5, CSS3 y JavaScript<br>Datos: IndexedDB en el dispositivo<br>Archivos: JSON (respaldos) y CSV (listas y reportes)<br>Códigos QR: jsQR y qrcode-generator</div></div>`}
async function setDoc(n){n=(n||'').trim();const old=cfg.doc||'';if(n==old)return;cfg.doc=n;for(const x of await all('sessions'))if(!x.teacher||x.teacher==old){x.teacher=n;await put('sessions',x)}}
async function saveDoc(){const n=v('dn').trim();if(!n)return toast('Escribe el nombre del docente');await setDoc(n);await put('kv',{k:'cfg',v:cfg});toast('Guardado');show()}
async function saveC(){cfg={tol:Math.max(0,Math.round(+v('ct')||0)),ant:v('ca').trim()===''?10:Math.min(240,Math.max(0,Math.round(+v('ca')||0))),pend:v('cp'),doc:cfg.doc||'',snd:v('cs')=='1'};await setDoc(v('cd'));await put('kv',{k:'cfg',v:cfg});toast('Guardado'+(cfg.snd?' · sonido activado':' · sonido desactivado'));beep(1)}
let NV='';
async function pubVer(){try{const c=new AbortController(),t=setTimeout(()=>c.abort(),8000),r=await fetch('version.json?t='+Date.now(),{cache:'no-store',signal:c.signal});clearTimeout(t);if(r.ok)return String((await r.json()).version||'')}catch(e){}return''}
async function doUpd(nv){nv=nv||NV;if(!nv)return;if(!navigator.onLine)return toast('Conéctate a internet para actualizar');toast('Actualizando a la versión '+nv+'…');
try{if('serviceWorker'in navigator)for(const r of await navigator.serviceWorker.getRegistrations())await r.unregister();if(window.caches)for(const k of await caches.keys())await caches.delete(k)}catch(e){}
location.replace(location.pathname+'?v='+encodeURIComponent(nv))}
async function upd(){if(location.protocol=='file:')return toast('Esta copia es un archivo suelto: para actualizarla, descarga el archivo nuevo.');
if(!navigator.onLine)return toast('Conéctate a internet para buscar actualizaciones');toast('Buscando actualización…');const nv=await pubVer();
if(!nv)return toast('No se pudo comprobar la versión publicada. Revisa tu conexión e inténtalo de nuevo.');
if(nv==VER)return toast('Ya tienes la versión más reciente ('+VER+')');doUpd(nv)}
async function autoUpd(){if(!document.querySelector('link[rel=manifest]')||!navigator.onLine)return;const nv=await pubVer();if(nv&&nv!=VER){NV=nv;const b=$('#updb');if(b){b.querySelector('span').textContent='Nueva versión '+nv+' disponible';b.hidden=false}}}
function theme(){const r=document.documentElement,n={auto:'light',light:'dark',dark:'auto'}[r.dataset.theme||'auto'];n=='auto'?r.removeAttribute('data-theme'):r.dataset.theme=n;try{localStorage.setItem('th',n)}catch(e){}toast('Tema: '+{auto:'automático',light:'claro',dark:'oscuro'}[n])}
async function bk(){const o={};for(const s of['groups','students','classes','sessions','records','kv'])o[s]=await all(s);dl('respaldo-asistencia.json',JSON.stringify(o))}
function rs(i){const f=i.files[0];if(!f)return;ask('Esto agrega/actualiza registros del respaldo. ¿Continuar?',()=>rs2(f))}function rs2(f){const r=new FileReader();r.onload=async()=>{try{const o=JSON.parse(r.result);for(const s of['groups','students','classes','sessions','records','kv'])for(const x of o[s]||[])await put(s,x);const c=await get('kv','cfg');if(c)cfg={...cfg,...c.v};toast('Restaurado');show()}catch(e){toast('Archivo inválido')}};r.readAsText(f)}
for(const k of['openC','openX','addS','addC','doImp','doImpH','doImpQ','saveC','saveDoc','close_','fixDay'])window[k]=once(window[k]);
addEventListener('unhandledrejection',e=>{BUSY=false;toast('Ocurrió un error: '+((e.reason&&e.reason.message)||e.reason||'desconocido')+'. Vuelve a intentarlo.')});
setInterval(()=>{const a=document.activeElement;if(tab=='hoy'&&!S&&!(a&&/INPUT|SELECT/.test(a.tagName))&&!($('#xs')&&$('#xs').value))show()},30000);(async()=>{try{const t=localStorage.getItem('th');if(t&&t!='auto')document.documentElement.dataset.theme=t}catch(e){}try{navigator.storage.persist()}catch(e){}try{const nv=new URLSearchParams(location.search).get('v');if(nv){history.replaceState(null,'',location.pathname);setTimeout(()=>toast(nv==VER?'App actualizada a la versión '+VER:'La versión '+nv+' aún no está publicada por completo: sigues en la '+VER+'. Revisa que se subieron todos los archivos.'),600)}}catch(e){}const c=await get('kv','cfg');if(c)cfg={tol:c.v.tol!=null?+c.v.tol:10,ant:c.v.ant!=null&&+c.v.ant>=0?+c.v.ant:10,pend:c.v.pend||'F',doc:c.v.doc||'',snd:c.v.snd!==false};show();setTimeout(autoUpd,1200)})();
if('serviceWorker'in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').then(r=>r.update()).catch(()=>{}));
